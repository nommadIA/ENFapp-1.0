/* Arrastar e soltar (touch + mouse) para reposicionar os botões de Acessos Rápidos */
function bindTlDrag(){
  const grid=$('#tl_grid');if(!grid||grid.dataset.db)return;
  grid.dataset.db='1';
  grid.querySelectorAll('.t[data-k]').forEach(tile=>{
    tile.addEventListener('pointerdown',e=>{
      if(!window._tlEdit||e.target.closest('.t-mv'))return;
      e.preventDefault();
      const dragKey=tile.dataset.k;
      tile.classList.add('dragging');
      try{tile.setPointerCapture(e.pointerId)}catch(err){}
      let lastSwap='';
      const onMove=ev=>{
        const els=document.elementsFromPoint(ev.clientX,ev.clientY);
        const over=els.find(el=>el.classList&&el.classList.contains('t')&&el.dataset.k&&el.dataset.k!==dragKey);
        grid.querySelectorAll('.t.drag-over').forEach(x=>x.classList.remove('drag-over'));
        if(over){
          const targetKey=over.dataset.k;
          over.classList.add('drag-over');
          if(targetKey!==lastSwap){
            lastSwap=targetKey;
            const ord=getTlOrder(),from=ord.indexOf(dragKey),to=ord.indexOf(targetKey);
            if(from>=0&&to>=0&&from!==to){
              ord.splice(from,1);ord.splice(to,0,dragKey);
              saveTlOrder(ord);
              // Reordenar DOM ao vivo sem quebrar o pointer capture
              ord.forEach(k=>{const el=grid.querySelector(`.t[data-k="${k}"]`);if(el)grid.appendChild(el)});
              navigator.vibrate&&navigator.vibrate(15);
            }
          }
        }else{lastSwap=''}
      };
      const onUp=()=>{
        tile.classList.remove('dragging');
        grid.querySelectorAll('.t.drag-over').forEach(x=>x.classList.remove('drag-over'));
        document.removeEventListener('pointermove',onMove);
        document.removeEventListener('pointerup',onUp);
        document.removeEventListener('pointercancel',onUp);
      };
      document.addEventListener('pointermove',onMove);
      document.addEventListener('pointerup',onUp);
      document.addEventListener('pointercancel',onUp);
    });
  });
}

function allPatients(){

    if(!map.has(k))map.set(k,{n,hc:hc||''});

  plIds().forEach(p=>add(p.pac,p.hc));

}

SKP.push('enf_oauth_cb');
let _ggBusy=false,_ggPoll=null,_ggMode='in';
function setGgBtn(busy,mode){
  _ggBusy=busy;
  const b=$('#btn_gg');if(!b)return;
  b.disabled=!!busy;
  const sp=b.querySelector('span');
  if(sp)sp.textContent=busy?(mode=='up'?'Cadastrando com Google…':'Conectando com Google…'):((mode||window._lm)=='up'?'Cadastrar com Google':'Entrar com Google');

function gg(authMode){
  const c=SB();
  if(!c.url||!c.key){uiAlert('Configuração do Supabase ausente.','Google');return}
  _ggMode=authMode||window._lm||'in';
  const redirectTo=location.origin+'/auth/callback';
  const authUrl=c.url+'/auth/v1/authorize?provider=google&prompt=select_account&redirect_to='+encodeURIComponent(redirectTo);
  const inIframe=(()=>{try{return window.self!==window.top}catch(e){return true}})();
  const w=520,h=660,l=Math.max(0,Math.round((screen.width-w)/2)),t=Math.max(0,Math.round((screen.height-h)/2));
  try{localStorage.removeItem('enf_oauth_cb')}catch(e){}
  const pop=window.open(authUrl,'enfapp_google_oauth',`width=${w},height=${h},left=${l},top=${t},popup=yes,resizable=yes,scrollbars=yes`);
  if(!pop||pop.closed){
    if(!inIframe){location.href=authUrl;return}
    const prev=$('#ui_dlg');if(prev)prev.remove();
    const d=document.createElement('div');d.className='dlg-m';d.id='ui_dlg';
    d.onclick=e=>{if(e.target===d)d.remove()};
    d.innerHTML=`<div class="dlg-box" role="dialog" aria-modal="true"><h3>Permitir janela do Google</h3><p>Seu navegador bloqueou a janela de login do Google. Toque no botão abaixo para abrir a autenticação com segurança.</p><div class="dlg-act"><button type="button" class="b ghost" data-d="1" onclick="$('#ui_dlg')?.remove()">Cancelar</button><a class="b" data-d="1" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center" href="${esc(authUrl)}" target="_blank" onclick="$('#ui_dlg')?.remove()">Continuar com Google</a></div></div>`;
    document.body.appendChild(d);
    return;
  }
  setGgBtn(true,_ggMode);
  if(_ggPoll)clearInterval(_ggPoll);
  _ggPoll=setInterval(()=>{
    try{
      const raw=localStorage.getItem('enf_oauth_cb');
      if(raw){
        localStorage.removeItem('enf_oauth_cb');
        const cb=JSON.parse(raw);
        if(cb&&Date.now()-(cb.ts||0)<120000){
          clearInterval(_ggPoll);_ggPoll=null;
          try{pop.close()}catch(e){}
          handleOAuthPayload(cb.hash||'',cb.search||'',_ggMode);
          return;
        }
      }
    }catch(e){}
    if(pop.closed){
      clearInterval(_ggPoll);_ggPoll=null;
      setGgBtn(false,_ggMode);
    }
  },450);
}
let _ggLastTok='';
async function handleOAuthPayload(hashStr,searchStr,mode){
  const h=new URLSearchParams(String(hashStr||'').replace(/^#/,''));
  const s=new URLSearchParams(String(searchStr||'').replace(/^\?/,''));
  const err=h.get('error_description')||s.get('error_description')||h.get('error')||s.get('error');
  if(err){
    setGgBtn(false,mode);
    const msg=decodeURIComponent(String(err).replace(/\+/g,' '));
    uiAlert('Não foi possível conectar com o Google:\n'+msg,'Login com Google');
    return true;
  }
  const tok=h.get('access_token'),ref=h.get('refresh_token')||'',ty=h.get('type')||s.get('type')||'';
  if(!tok||tok===_ggLastTok)return false;
  _ggLastTok=tok;
  if(_ggPoll){clearInterval(_ggPoll);_ggPoll=null}
  setGgBtn(true,mode);
  const c=SB();
  try{
    const q=await fetch(c.url+'/auth/v1/user',{headers:sbh(c,tok)});
    const u=await q.json().catch(()=>({}));
    if(!q.ok||!u.id)throw new Error(u.msg||u.message||'Sessão Google inválida ou expirada.');
    await sess({access_token:tok,refresh_token:ref,user:u},ty=='recovery');
    setGgBtn(false,mode);
    snack(mode=='up'?'Conta Google cadastrada e conectada ✓':'Conectado com Google ✓');
  }catch(e){
    setGgBtn(false,mode);
    uiAlert('Não foi possível concluir o acesso com Google: '+(e&&e.message||e),'Login com Google');
    login();
  }
  return true;
}
async function hauth(){
  const hs=location.hash||'',qs=location.search||'';
  if(!(hs.includes('access_token=')||hs.includes('error=')||qs.includes('error=')))return;
  history.replaceState(null,'',location.pathname);
  await handleOAuthPayload(hs,qs,window._lm||'in');
}
window.addEventListener('message',e=>{
  if(!e||!e.data||e.data.type!=='ENFAPP_OAUTH')return;
  const orig=e.origin||'';
  if(orig!==location.origin&&!orig.endsWith('.run.app')&&!orig.includes('localhost')&&!orig.endsWith('.netlify.app'))return;
  if(_ggPoll){clearInterval(_ggPoll);_ggPoll=null}
  try{localStorage.removeItem('enf_oauth_cb')}catch(err){}
  handleOAuthPayload(e.data.hash||'',e.data.search||'',_ggMode);
});
window.addEventListener('storage',e=>{
  if(e.key!=='enf_oauth_cb'||!e.newValue)return;
  try{
    const cb=JSON.parse(e.newValue);
    localStorage.removeItem('enf_oauth_cb');
    if(cb&&Date.now()-(cb.ts||0)<120000){
      if(_ggPoll){clearInterval(_ggPoll);_ggPoll=null}
      handleOAuthPayload(cb.hash||'',cb.search||'',_ggMode);
    }
  }catch(err){}
});

function sanitizeSvgToDataUrl(raw){
  const clean=String(raw||'')
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/\son[a-z]+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi,'')
    .replace(/javascript:/gi,'')
    .trim();
  if(!/<svg[\s>]/i.test(clean))return null;
  let wide=false;
  const vb=clean.match(/viewBox\s*=\s*["']\s*([\d.\-]+)[\s,]+([\d.\-]+)[\s,]+([\d.\-]+)[\s,]+([\d.\-]+)\s*["']/i);
  if(vb){const w=parseFloat(vb[3])||1,h=parseFloat(vb[4])||1;if(w/h>1.55)wide=true}
  else{
    const wm=clean.match(/\bwidth\s*=\s*["']([\d.]+)/i),hm=clean.match(/\bheight\s*=\s*["']([\d.]+)/i);
    if(wm&&hm&&parseFloat(wm[1])/Math.max(1,parseFloat(hm[1]))>1.55)wide=true;
  }
  const b64=btoa(unescape(encodeURIComponent(clean)));
  return {url:'data:image/svg+xml;base64,'+b64,wide};
}

function uploadBrandSvg(slot,inp){
  const f=inp&&inp.files&&inp.files[0];if(!f)return;
  const cur=getBrandLogos();
  const isSvg=/\.svg$/i.test(f.name)||f.type==='image/svg+xml';
  const isWebp=/\.webp$/i.test(f.name)||f.type==='image/webp';
  const isPng=/\.png$/i.test(f.name)||f.type==='image/png';
  if(!isSvg&&!isWebp&&!isPng){snack('Envie um arquivo SVG ou WebP.');return}
  const apply=(url,wide)=>{
    if(slot==='appDark'){cur.appDark=url;cur.appDarkWide=wide}
    else if(slot==='appLight'){cur.appLight=url;cur.appLightWide=wide}
    else if(slot==='devDark'){cur.devDark=url}
    else if(slot==='devLight'){cur.devLight=url}
    saveBrandLogos(cur);
    const lbl={appDark:'ENFapp (Modo Escuro)',appLight:'ENFapp (Modo Claro)',devDark:'CardDigital GM (Modo Escuro)',devLight:'CardDigital GM (Modo Claro)'}[slot]||'Logo';
    snack(lbl+' salvo para todos os usuários ✓');
  };
  if(isSvg){
    const r=new FileReader();
    r.onload=()=>{
      const res=sanitizeSvgToDataUrl(r.result);
      if(!res){snack('Arquivo SVG inválido.');return}
      apply(res.url,res.wide);
    };
    r.readAsText(f);
  }else{
    rd(f).then(u=>{
      const im=new Image();
      im.onload=()=>apply(u,(im.width/Math.max(1,im.height))>1.55);
      im.onerror=()=>snack('Não foi possível ler a imagem WebP/PNG.');
      im.src=u;
    });
  }
}

function avDraw(){
  const cv=$('#av_cv');if(!cv||!_avSt||!_avSt.img)return;
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height,im=_avSt.img;
  ctx.save();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#090d0b';ctx.fillRect(0,0,W,H);
  ctx.filter=avFilterCss();
  const rotRad=_avSt.rot*Math.PI/180,swap=_avSt.rot%180!==0;
  const iw=swap?im.height:im.width,ih=swap?im.width:im.height;
  const baseScale=Math.max(W/iw,H/ih)*_avSt.zoom;
  const dw=im.width*baseScale,dh=im.height*baseScale;
  ctx.translate(W/2+_avSt.ox*W/100,H/2+_avSt.oy*H/100);
  ctx.rotate(rotRad);
  ctx.drawImage(im,-dw/2,-dh/2,dw,dh);
  ctx.restore();
}

function avBindStage(){
  const st=$('#av_stage'),box=$('#av_crop');if(!st||!box||st.dataset.bd)return;
  st.dataset.bd='1';
  const ptrs=new Map();
  let mode=null,sx=0,sy=0,orig=null,pinch=null;
  const pairInfo=()=>{
    const arr=[...ptrs.values()];
    const dx=arr[1].x-arr[0].x,dy=arr[1].y-arr[0].y;
    return {dist:Math.hypot(dx,dy)||1,mx:(arr[0].x+arr[1].x)/2,my:(arr[0].y+arr[1].y)/2};
  };
  st.addEventListener('pointerdown',e=>{
    if(!_avSt)return;
    e.preventDefault();
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{st.setPointerCapture(e.pointerId)}catch(err){}
    if(ptrs.size===2){
      const p=pairInfo();
      mode='pinch';
      pinch={dist:p.dist,mx:p.mx,my:p.my,zoom:_avSt.zoom,ox:_avSt.ox,oy:_avSt.oy};
      return;
    }
    if(ptrs.size>2)return;
    const anc=e.target.closest&&e.target.closest('.av-anc');
    sx=e.clientX;sy=e.clientY;
    if(anc){
      mode='anc:'+anc.dataset.a;
      orig={..._avSt.crop};
    }else{
      mode='pan';
      orig={ox:_avSt.ox,oy:_avSt.oy};
    }
  });
  st.addEventListener('pointermove',e=>{
    if(!_avSt||!ptrs.has(e.pointerId))return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=st.getBoundingClientRect();
    if(mode==='pinch'&&ptrs.size>=2&&pinch){
      const p=pairInfo();
      _avSt.zoom=Math.max(1,Math.min(3.5,pinch.zoom*(p.dist/pinch.dist)));
      _avSt.ox=Math.max(-60,Math.min(60,pinch.ox+(p.mx-pinch.mx)/r.width*100));
      _avSt.oy=Math.max(-60,Math.min(60,pinch.oy+(p.my-pinch.my)/r.height*100));
      avUpdateZoomPill();
      avDraw();
      return;
    }
    if(!mode||!orig)return;
    const dx=(e.clientX-sx)/r.width*100,dy=(e.clientY-sy)/r.height*100;
    if(mode==='pan'){
      _avSt.ox=Math.max(-60,Math.min(60,orig.ox+dx));
      _avSt.oy=Math.max(-60,Math.min(60,orig.oy+dy));
      avDraw();
    }else if(mode.startsWith('anc:')){
      const a=mode.slice(4);
      const delta=((a[1]==='w'?-dx:dx)+(a[0]==='n'?-dy:dy))/2;
      let ns=Math.max(32,Math.min(96,orig.s+delta));
      let nx=orig.x,ny=orig.y;
      if(a[1]==='w')nx=orig.x+(orig.s-ns);
      if(a[0]==='n')ny=orig.y+(orig.s-ns);
      if(nx<2){ns-=2-nx;nx=2}
      if(ny<2){ns-=2-ny;ny=2}
      if(nx+ns>98)ns=98-nx;
      if(ny+ns>98)ns=98-ny;
      ns=Math.max(30,ns);
      _avSt.crop={x:nx,y:ny,s:ns};
      avUpdateCropDom();
    }
  });
  const end=e=>{
    ptrs.delete(e.pointerId);
    if(ptrs.size===1&&mode==='pinch'){
      const p=[...ptrs.values()][0];
      mode='pan';sx=p.x;sy=p.y;orig={ox:_avSt.ox,oy:_avSt.oy};pinch=null;
    }else if(ptrs.size===0){
      mode=null;pinch=null;
    }
  };
  st.addEventListener('pointerup',end);
  st.addEventListener('pointercancel',end);
  st.addEventListener('wheel',e=>{
    if(!_avSt||!_avSt.img)return;
    e.preventDefault();
    const factor=Math.exp(-e.deltaY*0.0018);
    _avSt.zoom=Math.max(1,Math.min(3.5,_avSt.zoom*factor));
    avUpdateZoomPill();
    avDraw();
  },{passive:false});
}

function hexToHsl(hex){
  let c=String(hex||'#adff2f').replace('#','').trim();
  if(c.length===3)c=c.split('').map(x=>x+x).join('');
  if(!/^[0-9a-fA-F]{6}$/.test(c))c='adff2f';
  const r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255;
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0,s=0,l=(mx+mn)/2;
  if(d){
    s=l>.5?d/(2-mx-mn):d/(mx+mn);
    if(mx===r)h=((g-b)/d+(g<b?6:0))/6;
    else if(mx===g)h=((b-r)/d+2)/6;
    else h=((r-g)/d+4)/6;
  }
  return [Math.round(h*360),Math.round(s*100),Math.round(l*100)];
}
function hslToHex(h,s,l){
  h=((+h%360)+360)%360;s=Math.max(0,Math.min(100,+s))/100;l=Math.max(0,Math.min(100,+l))/100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);
  const f=n=>Math.round(255*(l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))));
  return '#'+[f(0),f(8),f(4)].map(v=>v.toString(16).padStart(2,'0')).join('');
}

  const c=L('enf_cfg',DC);c.acc=clean;S('enf_cfg',c);tm();

}

async function smartCam(){
  smartCamClose();
  const m=document.createElement('div');
  m.className='m';m.id='scam_m';
  m.onclick=e=>{if(e.target===m)smartCamClose()};
  m.innerHTML=`<div style="max-width:480px">
    <i class="grab"></i>
    <div class="xh">
      <span class="xi"><svg viewBox="0 0 24 24" aria-hidden="true">${IC_CAM}</svg></span>

    </div>
    <div class="scam-box" id="scam_box" style="margin:12px 0">
      <video id="scam_vid" autoplay playsinline muted></video>
      <div class="scam-frame"></div>
      <div id="scam_ov" class="scam-scan" style="display:none"><div class="scam-spin"></div><span id="scam_msg">Analisando produto…</span></div>
    </div>
    <p class="mu" id="scam_hint" style="margin:0 0 12px;font-size:.82rem">Aponte para a embalagem ou etiqueta de preço e toque em Capturar, ou escolha uma foto do aparelho.</p>
    <div class="row" style="margin-bottom:8px">
      <button type="button" class="b" id="scam_cap" data-d="1" onclick="smartCamSnap()">📷 Capturar e ler produto</button>
    </div>
    <div class="row">
      <label class="b ghost" data-d="1" style="margin:0;cursor:pointer">📁 Tirar / escolher foto<input type="file" accept="image/*" capture="environment" hidden onchange="smartCamFile(this)"></label>
      <button type="button" class="b ghost" data-d="1" onclick="smartCamClose()">Fechar</button>
    </div>
  </div>`;
  document.body.appendChild(m);
  try{
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      _scStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:960}},audio:false});
      const v=$('#scam_vid');
      if(v){v.srcObject=_scStream;await v.play().catch(()=>{})}
    }else throw new Error('no_cam');
  }catch(e){

function smartCamSnap(){
  const v=$('#scam_vid');
  if(!v||!v.videoWidth){snack('Aguarde a câmera iniciar ou escolha uma foto.');return}
  const mx=1024,k=Math.min(1,mx/Math.max(v.videoWidth,v.videoHeight));
  const cv=document.createElement('canvas');
  cv.width=Math.round(v.videoWidth*k);cv.height=Math.round(v.videoHeight*k);
  cv.getContext('2d').drawImage(v,0,0,cv.width,cv.height);
  smartCamAnalyze(cv.toDataURL('image/jpeg',.82),'image/jpeg');
}

function smartCamFile(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const img=new Image();
  img.onload=()=>{
    const mx=1024,k=Math.min(1,mx/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');
    cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const dataUrl=cv.toDataURL('image/jpeg',.82);
    const bx=$('#scam_box');
    if(bx)bx.innerHTML=`<img src="${dataUrl}" alt="Produto"><div id="scam_ov" class="scam-scan"><div class="scam-spin"></div><span id="scam_msg">Lendo produto e preço…</span></div>`;
    smartCamAnalyze(dataUrl,'image/jpeg');
  };
  rd(f).then(u=>img.src=u);
}

async function smartCamAnalyze(dataUrl,mimeType){
  const ov=$('#scam_ov'),msg=$('#scam_msg');
  if(ov)ov.style.display='flex';
  if(msg)msg.textContent='Lendo embalagem e etiqueta…';
  try{
    const resp=await fetch('/api/scan-product',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({imageBase64:dataUrl,mimeType:mimeType||'image/jpeg'})
    });
    const data=await resp.json().catch(()=>({}));
    if(!resp.ok||data.error)throw new Error(data.error||'Não foi possível reconhecer o produto.');
    smartCamClose();
    window._mktScanPrev={img:dataUrl,info:data.detalhes||(data.preco!=null?'Nome e preço preenchidos automaticamente':'Nome preenchido — informe o preço para adicionar')};
    if(tab!='mkt'){tab='mkt';render()}else{
      const prevEl=$('#mkt_cam_prev');if(prevEl)prevEl.remove();
      const tools=document.querySelector('.mkt-tools');
      if(tools)tools.insertAdjacentHTML('afterend',`<div class="mkt-prev" id="mkt_cam_prev"><img src="${dataUrl}" alt="Produto"><div><b>✓ Produto identificado pela foto</b><small>${esc(window._mktScanPrev.info)}</small></div><button type="button" onclick="clearMktScanPrev()" aria-label="Fechar prévia">✕</button></div>`);
    }
    const pn=$('#pn'),pp=$('#pp'),pq=$('#pq');
    if(pn){pn.value=data.nome||'';pn.classList.add('mkt-glow');setTimeout(()=>pn.classList.remove('mkt-glow'),2200)}
    if(pp&&data.preco!=null){pp.value=data.preco;pp.classList.add('mkt-glow');setTimeout(()=>pp.classList.remove('mkt-glow'),2200)}
    if(pq){pq.value=data.quantidade||1}
    mktUpdateSub();
    snack('Produto preenchido! Confira e clique em Adicionar.');
    if(data.preco==null&&pp)pp.focus();
  }catch(e){
    if(ov)ov.style.display='none';
    uiAlert((e&&e.message)||'Erro ao ler o produto na foto.','Câmera Inteligente');
  }
}

function normSocUrl(kind,val){
  const v=String(val||'').trim();if(!v)return'';
  if(/^https?:\/\//i.test(v))return v;
  const h=v.replace(/^@/,'');
  if(kind==='ig')return'https://instagram.com/'+h;
  if(kind==='li')return v.includes('linkedin.com')?'https://'+v:'https://linkedin.com/in/'+h;
  if(kind==='fb')return v.includes('facebook.com')?'https://'+v:'https://facebook.com/'+h;
  if(kind==='tk')return'https://tiktok.com/@'+h;
  return'https://'+v;
}
function bioEncode(b){
  const p={n:b.nome,c:b.cargo,co:b.coren,ci:b.cidade,d:b.disp,b:b.bio,w:b.whatsapp,t:b.tel,e:b.email,ig:b.instagram,li:b.linkedin,fb:b.facebook,tk:b.tiktok,s:b.site,a:b.accent};
  Object.keys(p).forEach(k=>{if(!p[k])delete p[k]});
  const json=JSON.stringify(p);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function bioDecode(code){
  try{
    const b64=String(code||'').replace(/-/g,'+').replace(/_/g,'/');
    const pad=b64+'='.repeat((4-b64.length%4)%4);
    const p=JSON.parse(decodeURIComponent(escape(atob(pad))));
    return {
      nome:p.n||'',cargo:p.c||'',coren:p.co||'',cidade:p.ci||'',disp:p.d||'',bio:p.b||'',
      whatsapp:p.w||'',tel:p.t||'',email:p.e||'',instagram:p.ig||'',linkedin:p.li||'',
      facebook:p.fb||'',tiktok:p.tk||'',site:p.s||'',accent:p.a||'#adff2f'
    };
  }catch(e){return null}
}

async function exportBioQrPng(){
  const ctx0=window._qrBioCtx;if(!ctx0)return;
  const {b,url}=ctx0;
  const W=900,H=1240,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const g=cv.getContext('2d');
  const acc=b.accent||'#adff2f';
  const bg=g.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0b1a10');bg.addColorStop(1,'#070d0a');
  g.fillStyle=bg;g.fillRect(0,0,W,H);
  const glow=g.createRadialGradient(W*0.5,140,30,W*0.5,140,480);
  glow.addColorStop(0,acc+'44');glow.addColorStop(1,'transparent');
  g.fillStyle=glow;g.fillRect(0,0,W,H);
  // Header accent stripe
  g.fillStyle=acc;g.fillRect(0,0,W,16);
  // Avatar circle
  const avSrc=L('enf_avt','')||'';
  const cx=W/2,cy=165,r=78;
  g.save();g.beginPath();g.arc(cx,cy,r+6,0,Math.PI*2);g.fillStyle=acc;g.fill();g.restore();
  if(avSrc){
    try{
      const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=avSrc});
      g.save();g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.clip();
      g.drawImage(im,cx-r,cy-r,r*2,r*2);g.restore();
    }catch(e){}
  }else{
    g.save();g.beginPath();g.arc(cx,cy,r,0,Math.PI*2);g.fillStyle='#13261a';g.fill();
    g.fillStyle=acc;g.font='800 54px "Plus Jakarta Sans",sans-serif';g.textAlign='center';g.textBaseline='middle';
    const ini=(b.nome||'EN').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
    g.fillText(ini,cx,cy);g.restore();
  }
  g.textAlign='center';g.textBaseline='alphabetic';
  g.fillStyle='#ffffff';g.font='800 44px "Plus Jakarta Sans",sans-serif';
  g.fillText((b.nome||'Cartão Digital').slice(0,30),W/2,306);
  g.fillStyle='#b8cfc0';g.font='600 26px "Plus Jakarta Sans",sans-serif';
  g.fillText((b.cargo||'Profissional de Enfermagem').slice(0,44),W/2,350);
  if(b.coren){
    g.fillStyle=acc;g.font='800 24px "Plus Jakarta Sans",sans-serif';
    g.fillText('COREN '+b.coren,W/2,392);
  }
  // White rounded QR frame
  const qx=200,qy=440,qs=500,rad=36;
  g.save();g.beginPath();
  g.moveTo(qx+rad,qy);g.lineTo(qx+qs-rad,qy);g.quadraticCurveTo(qx+qs,qy,qx+qs,qy+rad);
  g.lineTo(qx+qs,qy+qs-rad);g.quadraticCurveTo(qx+qs,qy+qs,qx+qs-rad,qy+qs);
  g.lineTo(qx+rad,qy+qs);g.quadraticCurveTo(qx,qy+qs,qx,qy+qs-rad);
  g.lineTo(qx,qy+rad);g.quadraticCurveTo(qx,qy,qx+rad,qy);g.closePath();
  g.fillStyle='#ffffff';g.fill();g.restore();
  const qrCv=document.createElement('canvas');
  if(window.ENF_QR){
    await window.ENF_QR.toCanvas(qrCv,url,{width:440,margin:1,color:{dark:'#09180e',light:'#ffffff'}});
    g.drawImage(qrCv,qx+30,qy+30,440,440);
  }else{
    const ex=$('#qr_cv');if(ex)g.drawImage(ex,qx+30,qy+30,440,440);
  }
  g.fillStyle='#eaf5ee';g.font='700 26px "Plus Jakarta Sans",sans-serif';
  g.fillText('Aponte a câmera para abrir meu Cartão Digital',W/2,1022);
  if(b.whatsapp){
    g.fillStyle='#8db29b';g.font='600 24px "Plus Jakarta Sans",sans-serif';
    g.fillText('WhatsApp: '+b.whatsapp,W/2,1068);
  }
  g.fillStyle='#6c8c77';g.font='700 21px "Plus Jakarta Sans",sans-serif';
  g.fillText('ENFapp · Desenvolvido por CardDigital GM',W/2,1178);
  const a=document.createElement('a');
  a.href=cv.toDataURL('image/png');
  a.download='cartao-qr-'+((b.nome||'enfapp').toLowerCase().replace(/[^a-z0-9]+/g,'-'))+'.png';
  document.body.appendChild(a);a.click();a.remove();
  snack('Cartão QR (PNG) exportado ✓');
}
async function exportBioQrSvg(){
  const ctx0=window._qrBioCtx;if(!ctx0)return;

/* ===== Estender stkUp para Empilhamento de Configurações + Scroll Automático ao Topo ao Trocar de Sessão ===== */
const _stkCfg=stkUp;
stkUp=function(){
  _stkCfg();
  const h=document.querySelector('header'),hh=h?h.getBoundingClientRect().height:58,cs=$('#cfg_stack');
  if(!cs)return;
  cs.style.setProperty('--stt',(hh+10)+'px');
  const rs=[...cs.querySelectorAll('.cfg-stk')];
  rs.forEach((c,k)=>{
    const nx=rs[k+1],inn=c.firstElementChild;
    if(!nx||!inn){if(inn){inn.style.transform='';inn.style.filter=''}return}
    const st=parseFloat(getComputedStyle(c).top)||0,ch=Math.max(180,c.getBoundingClientRect().height||1);
    const q=Math.min(1,Math.max(0,1-(nx.getBoundingClientRect().top-(st+14))/ch));
    inn.style.transform=q>0.005?`scale(${1-.032*q}) translateY(${-5*q}px)`:'';
    inn.style.filter=q>0.005?`brightness(${1-.18*q})`:'';
  });
};
