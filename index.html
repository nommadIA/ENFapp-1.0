/* ===== Smartphone Polish: Alinhamento, Espaçamento e Ergonomia ===== */

html,body,*{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0;height:0;display:none}

/* ===== Plantão Cadastrado: Bloco de Data Verde + Empilhamento no Scroll + Ações por Ícones ===== */

  box-shadow:0 6px 16px var(--halo);
}
.prow-act button.btn-del{
  color:var(--er);
  background:color-mix(in srgb,var(--er) 10%,var(--cd));
  border-color:color-mix(in srgb,var(--er) 34%,transparent);
}
.prow-act button.btn-del:hover{
  background:color-mix(in srgb,var(--er) 20%,var(--cd));
  border-color:var(--er);
  box-shadow:0 6px 16px color-mix(in srgb,var(--er) 24%,transparent);
}
:root[data-theme="light"] .prow-act button{
  background:#ffffff;box-shadow:0 2px 8px rgba(10,26,32,.06);
}
:root[data-theme="light"] .prow-act button.btn-rec{
  background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 15%,#ffffff),color-mix(in srgb,var(--ok) 7%,#ffffff));
}
:root[data-theme="light"] .prow-act button.btn-rec.on{color:#ffffff}
:root[data-theme="light"] .prow-act button.btn-ed{background:color-mix(in srgb,var(--pr) 10%,#ffffff)}
:root[data-theme="light"] .prow-act button.btn-del{background:color-mix(in srgb,var(--er) 8%,#ffffff)}
body.mb .prow-act{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
body.mb .prow-act button{min-height:42px;padding:8px 9px;font-size:.76rem;border-radius:12px}
body.mb .prow-act button svg{width:15px;height:15px}

/* ===== Janela Fullscreen para Edição/Cadastro de Plantão ===== */
body.nosc{overflow:hidden!important;height:100dvh}
.m.m-fs{inset:0;padding:0;align-items:stretch;justify-content:stretch;background:var(--bg);z-index:40;-webkit-backdrop-filter:none;backdrop-filter:none}
body.dk .m.m-fs,body.mb .m.m-fs{align-items:stretch}
.m.m-fs>div.fs-win,body.dk .m.m-fs>div.fs-win,body.mb .m.m-fs>div.fs-win{width:100%;max-width:none;height:100dvh;max-height:100dvh;border-radius:0;border:0;margin:0;padding:0;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(55vmax 55vmax at 0% 0%,color-mix(in srgb,var(--pr) 18%,transparent),transparent 60%),var(--bg);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;animation:up .26s cubic-bezier(.2,.8,.2,1) both}
.fs-hd{flex:none;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.fs-hd-t{min-width:0;flex:1}
.fs-hd h2{margin:0;font-size:1.15rem;line-height:1.2}
.fs-hd small{display:block;color:var(--mu);font-size:.8rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs-bd{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.fs-in{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.fs-sec{padding:14px;border-radius:18px;background:var(--gl);border:1px solid var(--gb);display:flex;flex-direction:column;gap:2px}
.fs-sec h3{margin:0 0 8px;font-size:.86rem;font-weight:700;color:var(--pr)}
.fs-sec label:first-of-type{margin-top:2px}
.fs-ft{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 92%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.fs-ft-in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.fs-ft-in .b{flex:1;width:100%}

/* ===== Header Bell & Central de Notificações ===== */
.hntf{all:unset;flex:none;position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:13px;color:var(--tx);cursor:pointer;border:1px solid var(--gb);background:var(--gl);margin-left:auto;transition:transform .15s,box-shadow .2s,border-color .2s}
.hntf:hover{box-shadow:0 0 18px var(--halo);border-color:var(--pr)}.hntf:active{transform:scale(.9)}
.hntf svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hntf.has-u{color:var(--pr);border-color:color-mix(in srgb,var(--pr) 46%,transparent)}
.hntf .nbdg{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--er);color:#fff;font-size:.68rem;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px #ff5a4580;border:2px solid var(--bg);font-variant-numeric:tabular-nums}
header .hntf+.hx{margin-left:0}
body.mb .hntf{width:42px;height:42px;border-radius:13px}

.hero .pill.pl-go{cursor:pointer;transition:transform .15s,background .2s}
.hero .pill.pl-go:active{transform:scale(.95)}

.nbanner{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 15px;border-radius:20px;margin:10px 0 14px;border:1px solid color-mix(in srgb,var(--pr) 42%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 16%,var(--cd)),color-mix(in srgb,var(--cd) 92%,transparent));box-shadow:0 10px 26px #00000030}
.nbanner.k-fatura,.nbanner.k-vencimento{border-color:color-mix(in srgb,#f59e0b 52%,transparent);background:linear-gradient(135deg,color-mix(in srgb,#f59e0b 18%,var(--cd)),color-mix(in srgb,var(--cd) 92%,transparent))}
.nbanner.k-bloqueio{border-color:color-mix(in srgb,var(--er) 55%,transparent);background:linear-gradient(135deg,color-mix(in srgb,var(--er) 20%,var(--cd)),color-mix(in srgb,var(--cd) 92%,transparent))}
.nbanner-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nbanner-tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;color:var(--pr);text-transform:uppercase;letter-spacing:.04em}
.nbanner.k-fatura .nbanner-tag,.nbanner.k-vencimento .nbanner-tag{color:#fbbf24}
.nbanner.k-bloqueio .nbanner-tag{color:var(--er)}
.nbanner b{font-size:.98rem;line-height:1.25}
.nbanner p{margin:0;font-size:.86rem;color:var(--tx);opacity:.86;line-height:1.38}
.nbanner-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.nbanner-act button{min-height:36px;padding:6px 13px;border-radius:11px;font-size:.82rem;font-weight:700;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 80%,transparent);color:var(--tx)}
.nbanner-act button.pri{background:var(--pr);color:var(--on);border-color:var(--pr)}

.ncard{position:relative;padding:14px;border-radius:18px;border:1px solid var(--gb);border-left:4px solid var(--pr);background:color-mix(in srgb,var(--cd) 82%,transparent);margin:10px 0;display:flex;flex-direction:column;gap:8px}
.ncard.unread{border-color:color-mix(in srgb,var(--pr) 42%,transparent);border-left-color:var(--pr);box-shadow:0 6px 20px color-mix(in srgb,var(--pr) 12%,transparent)}
.ncard.k-fatura,.ncard.k-vencimento{border-left-color:#f59e0b}
.ncard.k-sucesso,.ncard.k-plano{border-left-color:var(--ok)}
.ncard.k-bloqueio{border-left-color:var(--er)}
.ncard-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ncard-h b{font-size:.96rem;line-height:1.25}
.ncard-h small{font-size:.74rem;color:var(--mu);white-space:nowrap}
.ncard p{margin:0;font-size:.88rem;line-height:1.42;white-space:pre-wrap;color:var(--tx);opacity:.9}
.ncard-meta{display:flex;flex-wrap:wrap;gap:6px}
.ncard-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:.76rem;font-weight:700;background:color-mix(in srgb,var(--pr) 13%,transparent);color:var(--tx);font-variant-numeric:tabular-nums}
.ncard-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.ncard-act button{min-height:36px;padding:6px 12px;border-radius:10px;font-size:.8rem;font-weight:700;border:1px solid var(--gb);background:var(--gl);color:var(--tx)}
.ncard-act button.pri{background:var(--pr);color:var(--on);border-color:var(--pr)}

/* ===== Cards Empilhados com Design Premium dos Planos ===== */
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.plan-top h1{margin:0}
.plan-me{padding:16px;border-radius:22px;border:1px solid color-mix(in srgb,var(--pr) 34%,var(--gb));background:linear-gradient(145deg,color-mix(in srgb,var(--pr) 14%,var(--cd)),color-mix(in srgb,var(--cd) 94%,transparent));box-shadow:0 12px 32px #00000028,inset 0 1px 0 #ffffff24;margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
.plan-me-r{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.plan-me b{font-size:1.15rem}
.plan-me small{color:var(--mu);font-size:.82rem;display:block}
.st-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:.74rem;font-weight:800;letter-spacing:.02em;border:1px solid transparent}
.st-badge i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.st-badge.st-ativo,.st-badge.st-master{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.st-badge.st-teste{color:#60a5fa;background:color-mix(in srgb,#60a5fa 15%,transparent);border-color:color-mix(in srgb,#60a5fa 35%,transparent)}
.st-badge.st-vencido{color:#fbbf24;background:color-mix(in srgb,#f59e0b 16%,transparent);border-color:color-mix(in srgb,#f59e0b 38%,transparent)}
.st-badge.st-bloqueado{color:var(--er);background:color-mix(in srgb,var(--er) 16%,transparent);border-color:color-mix(in srgb,var(--er) 38%,transparent)}

.plan-cyc{margin:0 0 16px}
.plan-cyc .sv-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:.7rem;font-weight:800;background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.plan-cyc .on .sv-tag{background:#00000028;color:var(--on)}

.plan-stack{position:relative;display:flex;flex-direction:column;gap:18px;margin-top:8px;padding-bottom:140px}
.plan-stk{position:sticky;top:calc(var(--stt,68px) + var(--pi,0)*16px)}
.plan-card{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;transform-origin:50% 0;will-change:transform,filter;border:1px solid var(--gb);box-shadow:0 -12px 30px #00000046,0 18px 42px #0000003c,inset 0 1px 0 #ffffff2a;display:flex;flex-direction:column;gap:14px}
.plan-card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,#ffffff16 0%,transparent 36%,transparent 72%,#ffffff08 100%)}
.plan-card.tier-basico{background:linear-gradient(155deg,#1b2624 0%,#101616 100%);border-color:color-mix(in srgb,#94a3b8 28%,transparent)}
.plan-card.tier-profissional{background:linear-gradient(152deg,#133329 0%,#0c1e1b 56%,#112a24 100%);border-color:color-mix(in srgb,var(--ok) 48%,transparent);box-shadow:0 -12px 30px #00000046,0 20px 46px color-mix(in srgb,var(--ok) 16%,#00000050),inset 0 1px 0 #ffffff34}
.plan-card.tier-premium{background:linear-gradient(146deg,color-mix(in srgb,var(--pr) 28%,#141e15) 0%,#0f1612 52%,color-mix(in srgb,var(--pr) 18%,#0b110d) 100%);border-color:color-mix(in srgb,var(--pr) 75%,transparent);box-shadow:0 -12px 30px #0000004c,0 22px 52px color-mix(in srgb,var(--pr) 24%,#00000060),inset 0 1px 0 #ffffff44}
:root[data-theme="light"] .plan-card.tier-basico{background:linear-gradient(155deg,#ffffff 0%,#f0f5f3 100%);border-color:#cbd8d4;box-shadow:0 -8px 22px #0a1a2012,0 14px 32px #0a1a2016}
:root[data-theme="light"] .plan-card.tier-profissional{background:linear-gradient(155deg,#edfaf4 0%,#dff3eb 100%);border-color:color-mix(in srgb,var(--ok) 45%,transparent);box-shadow:0 -8px 22px #0a1a2012,0 16px 36px #0a1a201a}
:root[data-theme="light"] .plan-card.tier-premium{background:linear-gradient(148deg,color-mix(in srgb,var(--pr) 22%,#ffffff) 0%,#f4faee 60%,color-mix(in srgb,var(--pr) 14%,#ffffff) 100%);border-color:var(--pr);box-shadow:0 -8px 22px #0a1a2014,0 18px 40px color-mix(in srgb,var(--pr) 22%,#0a1a2018)}
.plan-card.is-cur{box-shadow:0 -12px 30px #00000046,0 0 0 2px var(--pr),0 22px 48px var(--halo)}

.plan-hd{position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.plan-id{display:flex;align-items:center;gap:11px;min-width:0}
.plan-ico{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #ffffff24;background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr)}
.tier-basico .plan-ico{background:color-mix(in srgb,#94a3b8 16%,transparent);color:#cbd5e1}
:root[data-theme="light"] .tier-basico .plan-ico{color:#334155}
.tier-profissional .plan-ico{background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.tier-premium .plan-ico{background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 55%,#000));color:var(--on);box-shadow:0 6px 18px var(--halo);border-color:transparent}
.plan-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.plan-nm{font-size:1.22rem;font-weight:800;line-height:1.15;display:block}
.plan-tag{display:inline-block;margin-top:3px;font-size:.72rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--pr);opacity:.95}
.tier-basico .plan-tag{color:var(--mu)}
.tier-profissional .plan-tag{color:var(--ok)}
.plan-cur-pill{flex:none;padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:800;background:var(--pr);color:var(--on);white-space:nowrap}

.plan-price{position:relative;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:2px 0}
.plan-price .pv{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.plan-price .pp{font-size:.86rem;color:var(--mu);font-weight:600}
.plan-price .pe{margin-left:auto;font-size:.74rem;font-weight:800;color:var(--ok);padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ok) 15%,transparent)}
.plan-sub{position:relative;margin:-6px 0 0;font-size:.86rem;color:var(--tx);opacity:.82;line-height:1.38}

.plan-feats{position:relative;list-style:none;margin:0;padding:12px 0;border-top:1px solid #ffffff18;border-bottom:1px solid #ffffff18;display:flex;flex-direction:column;gap:8px}
:root[data-theme="light"] .plan-feats{border-color:#0a1a2014}
.plan-feats li{display:flex;align-items:center;gap:9px;font-size:.86rem;line-height:1.3;color:var(--tx)}
.plan-feats li.off{opacity:.48}
.plan-feats svg{width:17px;height:17px;flex:none;stroke:var(--ok);fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.tier-premium .plan-feats svg{stroke:var(--pr)}
.plan-feats li.off svg{stroke:var(--mu)}

.plan-btns{position:relative;display:flex;flex-direction:column;gap:8px}
.plan-btns .b{width:100%}
.plan-btns .plan-tr{all:unset;box-sizing:border-box;width:100%;min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 45%,transparent);color:var(--tx);font-size:.84rem;font-weight:700;cursor:pointer;transition:transform .15s,border-color .2s}
.plan-btns .plan-tr:active{transform:scale(.97)}

/* ===== Pix Box & Blocked Screen ===== */
.pix-box{padding:13px 14px;border-radius:16px;border:1px dashed color-mix(in srgb,var(--pr) 52%,transparent);background:color-mix(in srgb,var(--pr) 10%,transparent);display:flex;flex-direction:column;gap:6px;margin:10px 0}
.pix-key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem;font-weight:700;word-break:break-all;color:var(--tx);padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--cd) 72%,transparent);border:1px solid var(--gb)}
.blk-scr{max-width:480px;margin:18px auto;padding:24px 20px;border-radius:26px;border:1px solid color-mix(in srgb,var(--er) 45%,transparent);background:linear-gradient(155deg,color-mix(in srgb,var(--er) 14%,var(--cd)),var(--cd));text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 46px #00000040}
.blk-ico{width:68px;height:68px;border-radius:22px;margin:0 auto;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--er) 18%,transparent);color:var(--er);border:1px solid color-mix(in srgb,var(--er) 38%,transparent)}
.blk-ico svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Painel ADM Master ===== */
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.adm-head h1{margin:0}
.adm-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:.74rem;font-weight:800;background:color-mix(in srgb,var(--pr) 18%,transparent);color:var(--pr);border:1px solid color-mix(in srgb,var(--pr) 40%,transparent)}
.adm-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
@media (max-width:520px){.adm-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.adm-kpis .k{padding:11px 12px}
.adm-kpis .k b{font-size:1.25rem}

.ucard{padding:14px;border-radius:20px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 84%,transparent);margin:10px 0;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px #00000024}
.ucard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ucard-info{min-width:0;flex:1}
.ucard-info b{display:block;font-size:1rem;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard-info small{display:block;color:var(--mu);font-size:.8rem;line-height:1.35;overflow-wrap:anywhere}
.ucard-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ucard-act{display:grid;grid-template-columns:1.2fr 1.1fr 42px 42px;gap:7px;padding-top:10px;border-top:1px solid var(--gb)}
.ucard-act button{all:unset;box-sizing:border-box;min-height:38px;padding:0 10px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:11px;border:1px solid var(--gb);background:var(--gl);color:var(--tx);font-size:.79rem;font-weight:700;cursor:pointer;transition:transform .15s,border-color .2s}
.ucard-act button:active{transform:scale(.95)}
.ucard-act button.pri{background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr);border-color:color-mix(in srgb,var(--pr) 42%,transparent)}
.ucard-act button.wa{background:color-mix(in srgb,#25D366 16%,transparent);color:#4ade80;border-color:color-mix(in srgb,#25D366 42%,transparent)}
.ucard-act button.em{background:color-mix(in srgb,#60a5fa 14%,transparent);color:#60a5fa;border-color:color-mix(in srgb,#60a5fa 38%,transparent)}
.ucard-act button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ucard-act button.wa svg{fill:currentColor;stroke:none;width:17px;height:17px}

.adm-plan-ed{padding:16px;border-radius:20px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 84%,transparent);margin:12px 0;display:flex;flex-direction:column;gap:8px}
.adm-plan-ed h3{margin:0;font-size:1.05rem;display:flex;align-items:center;justify-content:space-between}
.adm-grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.adm-grid2 label{margin:4px 0 4px;font-size:.8rem}
.adm-tpl{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 12px}
.adm-tpl button{all:unset;box-sizing:border-box;padding:7px 12px;border-radius:99px;border:1px solid var(--gb);background:var(--gl);color:var(--tx);font-size:.78rem;font-weight:700;cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.adm-tpl button:hover,.adm-tpl button.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 16%,transparent);color:var(--pr)}
.adm-tpl button:active{transform:scale(.95)}
.adm-send-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.adm-send-row .b{min-height:46px;font-size:.86rem}
.b.wa-btn{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;box-shadow:0 8px 22px #25d36644}
.b.em-btn{background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;box-shadow:0 8px 22px #3b82f640}
.b.er-btn{background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 8px 22px #ef444440}
.sql-box{margin-top:18px;padding:14px;border-radius:18px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 72%,transparent)}
.sql-box summary{cursor:pointer;font-weight:700;font-size:.88rem;color:var(--pr)}

/* ===== Barra Superior: Tema Claro/Escuro + Notificações + Sair ===== */

.hthm:hover{box-shadow:0 0 18px var(--halo);border-color:var(--pr);color:var(--pr)}.hthm:active{transform:scale(.9) rotate(-14deg)}
.hthm svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
header .hthm+.hntf{margin-left:0}
body.mb .hthm{width:42px;height:42px;border-radius:13px}
body.mb header{gap:8px}

/* ===== Barra de Menu Inferior Liquid Glass + Abreviação Inteligente ===== */
body.mb .bar{background:linear-gradient(180deg,color-mix(in srgb,var(--cd) 60%,#ffffff 12%),color-mix(in srgb,var(--cd) 46%,transparent))!important;-webkit-backdrop-filter:blur(26px) saturate(210%)!important;backdrop-filter:blur(26px) saturate(210%)!important;border:1px solid color-mix(in srgb,#ffffff 24%,var(--gb))!important;box-shadow:inset 0 1px .5px #ffffff3d,inset 0 -1px 0 #00000028,0 16px 40px #00000046!important;border-radius:26px!important;padding:6px!important}
:root[data-theme="light"] body.mb .bar{background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(244,248,247,.62))!important;border-color:rgba(255,255,255,.88)!important;box-shadow:inset 0 1px 0 #ffffff,0 14px 36px rgba(10,26,32,.16)!important}
body.mb .bar button{border-radius:19px!important;padding:6px 4px!important}
body.mb .bar button.on{background:linear-gradient(180deg,color-mix(in srgb,var(--pr) 28%,transparent),color-mix(in srgb,var(--pr) 13%,transparent))!important;box-shadow:inset 0 1px 0 #ffffff34,0 4px 14px color-mix(in srgb,var(--pr) 22%,transparent)}
body.mb .bar span{font-size:.69rem;letter-spacing:-.01em;text-overflow:clip}

/* ===== Medicamentos & Últimos Registros Empilhados no Scroll ===== */
.med-stack,.reg-stack{position:relative;display:flex;flex-direction:column;gap:12px;margin:10px 0 14px;padding-bottom:26px}
.reg-stack{padding-bottom:84px}
.med-stk,.reg-stk{position:sticky;top:calc(var(--stt,68px) + var(--pi,0)*14px)}
.med-card,.reg-card{margin:0;padding:14px 15px;border-radius:20px;border:1px solid var(--gb);background:linear-gradient(150deg,color-mix(in srgb,var(--cd) 96%,var(--pr) 4%),color-mix(in srgb,var(--cd) 98%,transparent));display:flex;align-items:center;justify-content:space-between;gap:12px;transform-origin:50% 0;will-change:transform,filter;box-shadow:0 -10px 24px #0000003e,0 12px 26px #00000028,inset 0 1px 0 #ffffff1e;transition:border-color .2s}
:root[data-theme="light"] .med-card,:root[data-theme="light"] .reg-card{background:linear-gradient(150deg,#ffffff,#f5f9f8);box-shadow:0 -6px 18px #0a1a2010,0 10px 22px #0a1a2014}
.med-card{cursor:pointer}.med-card:hover{border-color:color-mix(in srgb,var(--pr) 45%,var(--gb))}.med-card:active{transform:scale(.99)}
.med-card>div:first-child,.reg-card>div:first-child{min-width:0;flex:1;overflow-wrap:anywhere}
.med-card b,.reg-card b{display:block;font-size:1rem;line-height:1.25}
.med-card small,.reg-card small{display:block;color:var(--mu);margin-top:2px;line-height:1.35}
.reg-card{border-left:4px solid var(--ok)}
.reg-card.st-pulado-c{border-left-color:var(--mu)}
.reg-card.st-atrasado-c{border-left-color:var(--er)}

/* ===== Busca de Pacientes / Para Mim no Editor Fullscreen de Medicamento ===== */
.pac-wrap{position:relative}
.pac-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.pac-chips button{all:unset;box-sizing:border-box;padding:6px 11px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid var(--gb);background:var(--gl);color:var(--tx);cursor:pointer;transition:transform .15s,border-color .2s,background .2s}
.pac-chips button.on{background:var(--pr);color:var(--on);border-color:var(--pr)}
.pac-chips button:active{transform:scale(.95)}
.pac-dd{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:25;max-height:220px;overflow-y:auto;border-radius:16px;border:1px solid color-mix(in srgb,var(--pr) 38%,var(--gb));background:color-mix(in srgb,var(--cd) 96%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 16px 38px #00000048;padding:6px;display:none;flex-direction:column;gap:4px}
.pac-dd.open{display:flex}
.pac-opt{all:unset;box-sizing:border-box;width:100%;padding:10px 12px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;color:var(--tx);transition:background .15s}
.pac-opt:hover,.pac-opt:active{background:color-mix(in srgb,var(--pr) 16%,transparent)}
.pac-opt b{font-size:.9rem;font-weight:700}
.pac-opt small{color:var(--mu);font-size:.76rem;white-space:nowrap}

/* ===== Organizar / Reordenar Acessos Rápidos (Long-Press) ===== */
.tl-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 8px}
body.mb .tl-hd{margin:12px 0 8px}
.tl-hd h2{margin:0!important}
.tl-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;margin:0 0 10px;border:1px solid color-mix(in srgb,var(--pr) 44%,transparent);background:color-mix(in srgb,var(--pr) 14%,var(--cd));animation:up .25s both}
.tl-bar small{font-size:.8rem;font-weight:700;color:var(--tx);flex:1;min-width:140px}
.tl-bar-act{display:flex;gap:6px;flex:none}
.tl-bar-act button{all:unset;box-sizing:border-box;padding:7px 12px;border-radius:10px;font-size:.78rem;font-weight:800;cursor:pointer;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 80%,transparent);color:var(--tx)}
.tl-bar-act button.pri{background:var(--pr);color:var(--on);border-color:var(--pr)}

.tl.editing .t{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-color:color-mix(in srgb,var(--pr) 44%,var(--gb));animation:jiggle .34s ease-in-out infinite alternate}
.tl.editing .t:nth-child(2n){animation-delay:-.17s}
.tl.editing .t.dragging{animation:none;cursor:grabbing;transform:scale(1.06);z-index:10;border-color:var(--pr);box-shadow:0 0 0 2px var(--pr),0 14px 32px var(--halo);opacity:.94}
.tl.editing .t.drag-over{border-style:dashed;border-color:var(--pr);background:color-mix(in srgb,var(--pr) 16%,var(--cd))}
.t-grip{position:absolute;top:7px;right:8px;font-size:.72rem;font-weight:800;color:var(--pr);opacity:.85;pointer-events:none;line-height:1}
.t-mv{display:flex;gap:4px;margin-top:2px}
.t-mv i{all:unset;display:inline-flex;align-items:center;justify-content:center;width:24px;height:20px;border-radius:7px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 82%,transparent);color:var(--tx);font-size:.82rem;font-weight:800;cursor:pointer;line-height:1}
.t-mv i:active{background:var(--pr);color:var(--on)}
@keyframes jiggle{0%{transform:rotate(-1.2deg)}100%{transform:rotate(1.2deg)}}

/* ===== Diálogos In-App (Alert/Confirm sem bloqueio de iframe) + Card Supabase ===== */
.dlg-m{position:fixed;inset:0;z-index:9999;background:rgba(5,9,7,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:18px;animation:up .18s both}
.dlg-box{width:100%;max-width:380px;border-radius:22px;padding:20px 18px 18px;background:var(--cd);border:1px solid var(--gb);box-shadow:0 24px 64px rgba(0,0,0,.55);color:var(--tx)}
.dlg-box h3{margin:0 0 8px;font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.dlg-box p{margin:0 0 16px;font-size:.92rem;line-height:1.45;color:var(--tx);white-space:pre-wrap;word-break:break-word}
.dlg-act{display:flex;gap:8px}
.dlg-act button{flex:1;margin:0}
.sb-card{border:1px solid var(--gb);border-radius:18px;padding:14px;background:color-mix(in srgb,var(--cd) 84%,transparent);margin:8px 0 12px}
.sb-st{display:flex;align-items:center;gap:8px;font-size:.86rem;font-weight:700;margin-bottom:6px}
.sb-dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mu)}
.sb-dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sb-dot.er{background:var(--er);box-shadow:0 0 10px var(--er)}
.b-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;padding:12px 16px;border-radius:16px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 92%,#ffffff 8%);color:var(--tx);font-weight:700;font-size:.96rem;cursor:pointer;transition:transform .14s,border-color .2s,box-shadow .2s}
.b-google:hover{border-color:color-mix(in srgb,var(--pr) 46%,var(--gb));box-shadow:0 8px 22px rgba(0,0,0,.22)}
.b-google:active{transform:scale(.98)}
.b-google:disabled{opacity:.65;cursor:wait}
.b-google svg{width:20px;height:20px;flex:none}
.gg-note{text-align:center;font-size:.78rem;color:var(--mu);margin:6px 0 2px}

/* ===== Botões Painel ADM & Minha Bio em Largura Total (Cores 100% Dinâmicas conforme o Tema do Usuário) ===== */
.tl .t[data-k="adm"],body.mb .tl .t[data-k="adm"],body.dk .tl .t[data-k="adm"],

  box-shadow:0 10px 26px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.16)!important;
}
:root[data-theme="light"] .tl .t[data-k="bio"],:root[data-theme="light"] body.mb .tl .t[data-k="bio"],:root[data-theme="light"] body.dk .tl .t[data-k="bio"]{

  box-shadow:0 10px 24px rgba(10,26,32,.1),inset 0 1px 0 #ffffff!important;
}
.tl .t[data-k="bio"]:hover,body.mb .tl .t[data-k="bio"]:hover,body.dk .tl .t[data-k="bio"]:hover{

}
.tl .t[data-k="bio"] svg,body.mb .tl .t[data-k="bio"] svg,body.dk .tl .t[data-k="bio"] svg{

/* ===== Versão DESKTOP Premium + Menu Lateral Retrátil (Expandir / Encolher) ===== */

body.dk #app>main:only-child{grid-area:auto;grid-column:1 / 3;margin:48px auto;max-width:440px}

body.dk header{

  height:64px;min-height:64px;
  max-width:none;width:100%;margin:0;
  padding:0 26px 0 16px;
  gap:12px;
  border-bottom:1px solid var(--gb);
  background:color-mix(in srgb,var(--cd) 76%,transparent);
  -webkit-backdrop-filter:blur(24px) saturate(180%);

}
.sb-tgl{
  all:unset;flex:none;
  width:40px;height:40px;
  display:none;align-items:center;justify-content:center;
  border-radius:13px;
  border:1px solid var(--gb);
  background:var(--gl);

.dk-crumb{

.dk-qact:hover{background:var(--pr);color:var(--on);box-shadow:0 6px 20px var(--halo)}

body.dk nav{

body.dk .sb-scroll{

  min-height:38px;
  padding:8px 11px;

/* ===== Performance iOS-Grade (60/120fps, Zero Repaint Jank) ===== */
body{background:var(--bg)!important;background-attachment:scroll!important;position:relative}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(55vmax 55vmax at 0% 0%,color-mix(in srgb,var(--pr) 24%,transparent),transparent 62%),radial-gradient(50vmax 50vmax at 100% 85%,#6d5dfc26,transparent 60%);
  transform:translateZ(0);will-change:transform;
}
.c,.k,.t,.seg,.al,.ucard,.adm-plan-ed{
  -webkit-backdrop-filter:none!important;backdrop-filter:none!important;
  background:color-mix(in srgb,var(--cd) 86%,transparent);
  contain:layout style;
}
:root[data-theme="light"] .c,:root[data-theme="light"] .k,:root[data-theme="light"] .t,:root[data-theme="light"] .seg,:root[data-theme="light"] .al{
  background:rgba(255,255,255,.92);
}
button,a,.t,.c,.chip,.av-btn{touch-action:manipulation}
.t{animation:none!important}
main>*:not(.tl){animation:up .22s cubic-bezier(.22,1,.36,1) both}
.b,.t,.c,.chip,.k{transition-timing-function:cubic-bezier(.22,1,.36,1)}

.clr-sw.on{border-color:var(--pr);box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 34%,transparent);background:color-mix(in srgb,var(--pr) 12%,var(--cd))}
.clr-sw i{width:18px;height:18px;border-radius:6px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 6px rgba(0,0,0,.25)}
.clr-sw span{font-size:.73rem;font-weight:700;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:520px){.clr-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.clr-mix{display:flex;flex-direction:column;gap:9px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--gb) 70%,transparent)}
.clr-sl{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:10px}
.clr-sl span{font-size:.74rem;font-weight:700;color:var(--mu)}
.clr-sl b{font-size:.73rem;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--tx)}
.clr-sl input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:99px;padding:0;border:1px solid rgba(255,255,255,.18);cursor:pointer;
}
.clr-sl input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;border:2.5px solid #0b1610;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:grab;
}
.clr-sl input[type=range]::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid #0b1610;box-shadow:0 2px 8px rgba(0,0,0,.45);cursor:grab;
}
.clr-hue{background:linear-gradient(90deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#5856d6,#af52de,#ff2d55,#ff3b30)!important}

.cfg-sw-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--gb);background:color-mix(in srgb,var(--bg) 52%,transparent)}
.cfg-sw-row span{font-size:.86rem;font-weight:600}
.ios-sw{position:relative;width:48px;height:28px;flex:none;display:inline-block;margin:0}
.ios-sw input{opacity:0;width:0;height:0;position:absolute}
.ios-sw i{position:absolute;inset:0;border-radius:99px;background:var(--gb);transition:background .22s;cursor:pointer}
.ios-sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .22s cubic-bezier(.22,1,.36,1)}
.ios-sw input:checked+i{background:var(--pr)}
.ios-sw input:checked+i::after{transform:translateX(20px)}
.cfg-save-bar{
  margin-top:16px;padding:14px 18px;border-radius:20px;
  border:1px solid color-mix(in srgb,var(--pr) 36%,var(--gb));
  background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 14%,var(--cd)),color-mix(in srgb,var(--cd) 92%,transparent));
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  box-shadow:0 12px 30px rgba(0,0,0,.2);
}
.cfg-save-bar>div b{display:block;font-size:.94rem}
.cfg-save-bar>div small{display:block;font-size:.77rem;color:var(--mu)}
.cfg-save-bar .b{width:auto;min-width:210px}
@media(max-width:600px){.cfg-save-bar .b{width:100%}}

/* ===== Minha Bio — Cartão de Visita Digital ===== */
.bio-grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
body.dk .bio-grid{grid-template-columns:1.05fr .95fr;gap:22px;align-items:start}
.bio-card-wrap{display:flex;flex-direction:column;gap:12px}
body.dk .bio-card-wrap{position:sticky;top:84px}
.bio-card{
  --ba:var(--pr);
  position:relative;overflow:hidden;
  border-radius:28px;
  border:1px solid color-mix(in srgb,var(--ba) 40%,var(--gb));
  background:linear-gradient(165deg,color-mix(in srgb,var(--ba) 16%,var(--cd)) 0%,var(--cd) 46%,color-mix(in srgb,var(--bg) 96%,transparent) 100%);
  box-shadow:0 22px 54px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.22);
  padding:0 0 20px;
}
.bio-banner{
  height:92px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--ba) 0%,color-mix(in srgb,var(--ba) 52%,#06200d) 100%);
}
.bio-banner::after{
  content:"";position:absolute;right:-30px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.32),transparent 68%);
}
.bio-banner-tag{
  position:absolute;top:12px;right:14px;z-index:2;
  padding:4px 10px;border-radius:99px;font-size:.69rem;font-weight:800;letter-spacing:.02em;
  background:rgba(7,22,12,.58);color:#fff;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);
}
.bio-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px;margin-top:-48px;position:relative;z-index:2}
.bio-av{
  width:94px;height:94px;border-radius:50%;overflow:hidden;
  border:3.5px solid var(--cd);
  box-shadow:0 0 0 2.5px var(--ba),0 12px 28px rgba(0,0,0,.38);
  background:var(--cd);display:flex;align-items:center;justify-content:center;
}
.bio-av img{width:100%;height:100%;object-fit:cover;display:block}
.bio-head h2{margin:12px 0 3px!important;font-size:1.32rem;font-weight:800;letter-spacing:-.02em;color:var(--tx)}
.bio-role{font-size:.86rem;font-weight:600;color:var(--mu);margin:0 0 8px}
.bio-badges{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.bio-bdg{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 10px;border-radius:99px;font-size:.72rem;font-weight:800;
  background:color-mix(in srgb,var(--ba) 16%,transparent);color:var(--ba);
  border:1px solid color-mix(in srgb,var(--ba) 34%,transparent);
}
.bio-bdg.avail{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 36%,transparent)}
.bio-bdg.avail i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);display:inline-block}
.bio-txt{
  margin:4px 20px 14px;padding:12px 14px;border-radius:16px;
  border:1px solid var(--gb);background:color-mix(in srgb,var(--bg) 52%,transparent);
  font-size:.85rem;line-height:1.5;color:var(--tx);text-align:left;white-space:pre-line;
}
.bio-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:0 20px;margin-bottom:14px}
.bio-act{
  display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 12px;border-radius:14px;text-decoration:none;
  font-size:.84rem;font-weight:800;border:1px solid var(--gb);
  background:color-mix(in srgb,var(--bg) 55%,transparent);color:var(--tx);
  cursor:pointer;transition:transform .14s,border-color .2s;
}
.bio-act:hover{border-color:var(--ba);transform:translateY(-1px)}
.bio-act.wa{background:linear-gradient(135deg,#25d366,#128c7e);border-color:transparent;color:#fff;grid-column:1 / -1;box-shadow:0 8px 22px rgba(37,211,102,.32)}
.bio-act svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bio-socs{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:0 20px 14px}
.bio-soc{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 12px;border-radius:12px;text-decoration:none;
  border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 85%,transparent);
  color:var(--tx);font-size:.76rem;font-weight:700;transition:border-color .2s,color .2s;
}
.bio-soc:hover{border-color:var(--ba);color:var(--ba)}
.bio-soc svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bio-foot-brand{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px 0;margin:0 20px;border-top:1px solid var(--gb);
  font-size:.72rem;color:var(--mu);font-weight:600;
}
.bio-share-bar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bio-share-bar .b{min-height:42px;padding:9px 12px;font-size:.82rem}
.bio-pub-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 36px;gap:14px}
.bio-pub-shell .bio-card{width:100%;max-width:440px}
.qr-stage{
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:18px;border-radius:20px;border:1px solid var(--gb);
  background:color-mix(in srgb,var(--bg) 55%,transparent);margin:12px 0;
}
.qr-frame{
  padding:14px;border-radius:18px;background:#ffffff;
  box-shadow:0 12px 32px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;
}
.qr-frame canvas,.qr-frame img{width:220px;height:220px;display:block}
.bio-f2{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:560px){.bio-f2{grid-template-columns:1fr 1fr}}

/* ===== Editor Interativo de Foto do Usuário (Âncoras + Corte + Enquadrar + Filtros) ===== */
.av-st-wrap{display:flex;flex-direction:column;gap:14px;align-items:center}
.av-stage{
  position:relative;width:min(300px,78vw);height:min(300px,78vw);
  border-radius:22px;overflow:hidden;background:#070a09;
  border:1px solid var(--gb);touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 16px 40px rgba(0,0,0,.45);
}
.av-stage canvas{width:100%;height:100%;display:block;background:transparent;border:0;border-radius:0;cursor:grab}
.av-stage canvas:active{cursor:grabbing}
.av-crop-box{
  position:absolute;
  border:2px solid var(--pr);
  box-shadow:0 0 0 9999px rgba(4,8,6,.62),inset 0 0 0 1px rgba(255,255,255,.35);
  border-radius:14px;
  cursor:move;touch-action:none;
}
.av-crop-circle{
  position:absolute;inset:0;border-radius:50%;
  border:1.5px dashed rgba(255,255,255,.72);
  pointer-events:none;
}
.av-grid-lines{
  position:absolute;inset:0;pointer-events:none;opacity:.32;
  background:linear-gradient(to right,transparent 33%,#fff 33.4%,transparent 33.8%,transparent 66%,#fff 66.4%,transparent 66.8%),
             linear-gradient(to bottom,transparent 33%,#fff 33.4%,transparent 33.8%,transparent 66%,#fff 66.4%,transparent 66.8%);
}
.av-anc{
  position:absolute;width:24px;height:24px;border-radius:8px;
  background:var(--pr);border:2.5px solid #08180a;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
  transform:translate(-50%,-50%);touch-action:none;z-index:4;
}
.av-anc.nw{left:0;top:0;cursor:nwse-resize}
.av-anc.ne{left:100%;top:0;cursor:nesw-resize}
.av-anc.sw{left:0;top:100%;cursor:nesw-resize}
.av-anc.se{left:100%;top:100%;cursor:nwse-resize}
.av-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:100%}
.av-tools button,.av-tools label{
  all:unset;box-sizing:border-box;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;padding:6px 12px;border-radius:11px;
  border:1px solid var(--gb);background:var(--gl);color:var(--tx);
  font-size:.79rem;font-weight:700;cursor:pointer;
  transition:transform .14s,border-color .2s,color .2s;
}
.av-tools button:hover,.av-tools label:hover{border-color:var(--pr);color:var(--pr)}
.av-tools button:active,.av-tools label:active{transform:scale(.95)}
.av-zoom-pill{
  position:absolute;right:10px;bottom:10px;z-index:5;pointer-events:none;
  padding:4px 9px;border-radius:99px;font-size:.72rem;font-weight:800;
  background:rgba(7,14,10,.76);color:var(--pr);border:1px solid color-mix(in srgb,var(--pr) 42%,transparent);
  font-variant-numeric:tabular-nums;
}
.av-gest-hint{font-size:.74rem;color:var(--mu);text-align:center;margin:-6px 0 0}
.av-sliders{width:100%;display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--gb);background:color-mix(in srgb,var(--cd) 72%,transparent)}
.av-sl-r{display:flex;align-items:center;gap:10px}
.av-sl-r span{font-size:.77rem;font-weight:700;color:var(--mu);min-width:68px}
.av-sl-r input[type=range]{flex:1;padding:0;border:0;background:transparent;accent-color:var(--pr)}
.av-sl-r b{font-size:.75rem;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.av-flts{display:flex;gap:8px;overflow-x:auto;width:100%;padding:2px 2px 4px}
.av-flt{
  all:unset;box-sizing:border-box;flex:none;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:6px;border-radius:14px;border:1.5px solid var(--gb);
  background:color-mix(in srgb,var(--cd) 78%,transparent);
  cursor:pointer;min-width:66px;transition:border-color .18s,transform .14s;
}
.av-flt.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 15%,var(--cd))}
.av-flt:active{transform:scale(.94)}
.av-flt img{width:46px;height:46px;border-radius:10px;object-fit:cover;display:block;background:#111}
.av-flt span{font-size:.7rem;font-weight:700;color:var(--tx)}

/* ===== Mercado Premium + Câmera Inteligente (Cadastro por Foto) ===== */
.mkt-grid{display:grid;grid-template-columns:1fr;gap:16px}
body.dk .mkt-grid{grid-template-columns:1.06fr 1fr;gap:22px;align-items:start}
.mkt-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.mkt-wallet{
  position:relative;overflow:hidden;
  padding:20px;border-radius:24px;
  border:1px solid color-mix(in srgb,var(--pr) 42%,var(--gb));
  background:linear-gradient(145deg,color-mix(in srgb,var(--pr) 20%,var(--cd)) 0%,color-mix(in srgb,var(--cd) 94%,transparent) 68%);
  box-shadow:inset 0 1px 0 #ffffff24,0 14px 36px rgba(0,0,0,.22);
  display:flex;flex-direction:column;gap:14px;
}
.mkt-w-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mkt-w-bal small{display:block;font-size:.78rem;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.mkt-w-bal b{display:block;font-size:clamp(1.75rem,6vw,2.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.mkt-w-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mkt-w-st{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--bg) 56%,transparent);border:1px solid var(--gb)}
.mkt-w-st small{display:block;font-size:.71rem;color:var(--mu);font-weight:600}
.mkt-w-st b{display:block;font-size:.96rem;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.mkt-qchips{display:flex;gap:7px;flex-wrap:wrap}
.mkt-qchips button{all:unset;box-sizing:border-box;padding:6px 11px;border-radius:99px;font-size:.76rem;font-weight:800;border:1px solid color-mix(in srgb,var(--pr) 34%,var(--gb));background:color-mix(in srgb,var(--pr) 12%,transparent);color:var(--pr);cursor:pointer;transition:transform .14s,background .18s}
.mkt-qchips button:hover{background:var(--pr);color:var(--on)}
.mkt-qchips button:active{transform:scale(.94)}

.mkt-card{
  padding:18px;border-radius:22px;border:1px solid var(--gb);
  background:color-mix(in srgb,var(--cd) 88%,transparent);
  box-shadow:inset 0 1px 0 #ffffff1a,0 10px 26px rgba(0,0,0,.15);
  display:flex;flex-direction:column;gap:12px;
}
.mkt-card h2{margin:0!important;font-size:1.08rem}
.mkt-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mkt-tbtn{
  all:unset;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:12px 8px;border-radius:16px;text-align:center;
  border:1px solid var(--gb);background:color-mix(in srgb,var(--bg) 54%,transparent);
  color:var(--tx);font-size:.76rem;font-weight:700;cursor:pointer;
  transition:transform .15s,border-color .2s,box-shadow .2s;
}
.mkt-tbtn svg{width:22px;height:22px;stroke:var(--pr);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mkt-tbtn:hover{border-color:var(--pr);transform:translateY(-1px)}
.mkt-tbtn:active{transform:scale(.95)}
.mkt-tbtn.smart{
  background:linear-gradient(135deg,var(--pr),color-mix(in srgb,var(--pr) 74%,#3ca61d));
  border-color:color-mix(in srgb,#ffffff 34%,var(--pr));
  color:#ffffff;text-shadow:0 1px 2px rgba(6,28,10,.55);
  box-shadow:0 8px 22px var(--halo);
}
.mkt-tbtn.smart svg{stroke:color-mix(in srgb,var(--pr) 28%,#062108);stroke-width:2.3}

.mkt-prev{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:15px;
  border:1px solid color-mix(in srgb,var(--ok) 44%,transparent);
  background:color-mix(in srgb,var(--ok) 12%,var(--cd));
  animation:up .22s both;
}
.mkt-prev img{width:48px;height:48px;border-radius:11px;object-fit:cover;flex:none;border:1px solid var(--gb)}
.mkt-prev>div{min-width:0;flex:1}
.mkt-prev b{display:block;font-size:.84rem;color:var(--ok)}
.mkt-prev small{display:block;font-size:.76rem;color:var(--tx);opacity:.86;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkt-prev button{all:unset;width:28px;height:28px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--mu);cursor:pointer;flex:none}
.mkt-flds{display:grid;grid-template-columns:2fr 1.15fr .72fr;gap:8px}
.mkt-flds label{margin:0 0 4px;font-size:.74rem;font-weight:700}
.mkt-sub-bar{display:flex;align-items:center;justify-content:space-between;font-size:.82rem;color:var(--mu);padding:2px 2px 0}
.mkt-sub-bar b{color:var(--pr);font-variant-numeric:tabular-nums}
.mkt-glow{border-color:var(--ok)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 28%,transparent)!important}

.mkt-item{
  display:flex;align-items:center;gap:11px;
  padding:12px 13px;border-radius:16px;
  border:1px solid var(--gb);background:color-mix(in srgb,var(--bg) 44%,transparent);
}
.mkt-qty{
  flex:none;min-width:34px;height:34px;padding:0 8px;border-radius:10px;
  background:color-mix(in srgb,var(--pr) 15%,transparent);color:var(--pr);
  font-size:.82rem;font-weight:800;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.mkt-it-tx{min-width:0;flex:1}
.mkt-it-tx b{display:block;font-size:.93rem;line-height:1.25;overflow-wrap:anywhere}
.mkt-it-tx small{display:block;font-size:.78rem;color:var(--mu);margin-top:2px;font-variant-numeric:tabular-nums}
.mkt-it-tot{text-align:right;flex:none}
.mkt-it-tot b{display:block;font-size:.94rem;font-weight:800;font-variant-numeric:tabular-nums}
.mkt-it-tot button{all:unset;margin-top:3px;font-size:.73rem;font-weight:700;color:var(--er);cursor:pointer}

.scam-box{position:relative;width:100%;aspect-ratio:4 / 3;max-height:320px;border-radius:18px;overflow:hidden;background:#050807;border:1px solid var(--gb);display:flex;align-items:center;justify-content:center}
.scam-box video,.scam-box img{width:100%;height:100%;object-fit:cover;display:block}
.scam-frame{position:absolute;inset:14%;border:2px dashed color-mix(in srgb,var(--pr) 82%,transparent);border-radius:16px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.32)}
.scam-scan{position:absolute;inset:0;background:rgba(5,12,8,.76);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:700;text-align:center;padding:16px}
.scam-spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:var(--pr);animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Contenção Global & Refinamento Completo Mobile (Zero Overflow / Zero Corte) ===== */
html,body,#app{max-width:100%;overflow-x:clip}
main{width:100%;box-sizing:border-box}
main>*,
.two>*,
.kpis>*,
.cfg-grid>*,
.mkt-grid>*,
.bio-grid>*,
.brand-grid>*,
.brand-dual>*,
.g>*,
.cfg-prof-fields>*,
.bio-f2>*,
.mkt-flds>*,
.mkt-col>*,
.clr-grid>*,
.bio-acts>*,
.bio-share-bar>*,
.bio-socs-grid>*{min-width:0;max-width:100%}

.row{max-width:100%}
.row>*{min-width:0}
.row>.b,.row>label.b{width:auto;flex:1 1 0;min-width:0}
.row>.b.fit,.row>button.b.fit,.row>label.b.fit{flex:0 0 auto!important;width:auto!important;white-space:nowrap;padding-left:14px;padding-right:14px}

/* Logos Duais (Modo Claro + Modo Escuro) */
.brand-group{display:flex;flex-direction:column;gap:10px}
.brand-dual{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:520px){.brand-dual{grid-template-columns:repeat(2,minmax(0,1fr))}}
.brand-ver{
  padding:12px;border-radius:15px;border:1px solid var(--gb);
  background:color-mix(in srgb,var(--cd) 72%,transparent);
  display:flex;flex-direction:column;gap:9px;min-width:0;
}
.brand-ver-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand-ver-hd b{font-size:.82rem;color:var(--tx)}
.brand-ver-hd small{font-size:.69rem;font-weight:800;padding:2px 8px;border-radius:99px;border:1px solid var(--gb);color:var(--mu)}
.brand-ver-prev{
  height:56px;border-radius:11px;border:1px dashed var(--gb);
  display:flex;align-items:center;justify-content:center;padding:8px 12px;overflow:hidden;
}
.brand-ver-prev.is-dark{background:#0b1510;border-color:#264030;color:#eaf5ee}
.brand-ver-prev.is-light{background:#f3f7f4;border-color:#cbd9d0;color:#102318}
.brand-ver-prev img{max-height:36px;max-width:100%;width:auto;object-fit:contain;display:block}
.brand-ver-acts{display:flex;gap:7px;align-items:center}
.brand-ver-acts .b{min-height:38px;padding:7px 10px;font-size:.79rem;border-radius:11px}

/* Cartão Digital Premium: Ações Simétricas + Grade de Ícones Grandes Oficiais das Redes */
.bio-card{max-width:100%;box-sizing:border-box}
.bio-acts-row{display:grid;gap:9px;padding:0 20px;margin-bottom:14px}
.bio-acts-row.cols-1{grid-template-columns:1fr}
.bio-acts-row.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.bio-acts-row.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.bio-wa-wrap{padding:0 20px;margin-bottom:10px}
.bio-act.wa-main{
  width:100%;display:flex;align-items:center;justify-content:center;gap:9px;
  min-height:48px;padding:11px 16px;border-radius:16px;text-decoration:none;
  font-size:.92rem;font-weight:800;color:#ffffff;border:0;
  background:linear-gradient(135deg,#25d366 0%,#128c7e 100%);
  box-shadow:0 10px 26px rgba(37,211,102,.34),inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .15s,box-shadow .2s;
}
.bio-act.wa-main:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(37,211,102,.44)}
.bio-act.wa-main svg{width:20px;height:20px;flex:none;fill:currentColor;stroke:none}
.bio-act.sub-btn{
  flex-direction:column;gap:5px;min-height:60px;padding:9px 8px;border-radius:15px;
  font-size:.77rem;font-weight:700;text-align:center;
}
.bio-act.sub-btn svg{width:19px;height:19px;stroke:var(--ba)}

.bio-socs-hd{
  padding:0 20px 8px;font-size:.72rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.07em;color:var(--mu);text-align:center;
}
.bio-socs-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
  padding:0 20px 16px;
}
.bio-socs-grid.cnt-1{grid-template-columns:minmax(0,180px);justify-content:center}
.bio-socs-grid.cnt-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.bio-soc-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:92px;padding:12px 8px;border-radius:18px;text-decoration:none;
  border:1px solid var(--gb);
  background:color-mix(in srgb,var(--bg) 52%,var(--cd));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.18);
  transition:transform .16s cubic-bezier(.22,1,.36,1),border-color .2s,box-shadow .2s;
}
.bio-soc-tile:hover{
  transform:translateY(-2px);
  border-color:color-mix(in srgb,var(--ba) 55%,var(--gb));
  box-shadow:0 12px 26px rgba(0,0,0,.28);
}
.bio-soc-tile:active{transform:scale(.95)}
.bio-soc-ico{
  width:46px;height:46px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#ffffff;box-shadow:0 6px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.28);
}
.bio-soc-ico svg{width:24px;height:24px;display:block;fill:currentColor;stroke:none}
.bio-soc-ico.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%)}
.bio-soc-ico.wa{background:linear-gradient(135deg,#25d366,#128c7e)}
.bio-soc-ico.li{background:linear-gradient(135deg,#0a66c2,#004182)}
.bio-soc-ico.fb{background:linear-gradient(135deg,#1877f2,#0d5bd9)}
.bio-soc-ico.tk{background:linear-gradient(135deg,#14161a,#000000);border:1px solid rgba(255,255,255,.22)}
.bio-soc-ico.site{background:linear-gradient(135deg,var(--ba),color-mix(in srgb,var(--ba) 55%,#072312));color:var(--on)}
.bio-soc-ico.site svg{fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.bio-soc-tile span{
  font-size:.76rem;font-weight:800;color:var(--tx);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* Mobile Precision Overrides (Todas as Telas Alinhadas no Enquadramento) */
body.mb main{padding:12px 14px calc(108px + env(safe-area-inset-bottom,0px))!important;max-width:100%!important}

body.mb .hl{min-width:0;overflow:hidden}
body.mb .lg-custom-svg{max-width:118px;height:26px}
body.mb .hero-pro{padding:15px 15px;border-radius:22px;gap:12px;margin:2px 0 14px}
body.mb .hero-pro-l{gap:12px}
body.mb .hero-pro .av-btn{width:62px!important;height:62px!important}
body.mb .hero-pro-tx h1{font-size:1.34rem}
body.mb .kpis{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}
body.mb .kpi-card{padding:13px 12px;border-radius:18px;gap:8px}
body.mb .kpi-top small{font-size:.73rem}
body.mb .kpi-ic{width:28px;height:28px;border-radius:9px}
body.mb .kpi-card b{font-size:clamp(.98rem,4.3vw,1.18rem)}
body.mb .two{grid-template-columns:minmax(0,1fr)!important;gap:16px!important}
body.mb .two>section{width:100%;min-width:0;max-width:100%;padding:0;border:0;background:transparent;box-shadow:none}
body.mb .tl-hd{gap:8px;max-width:100%}
body.mb .tl-hd h2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.mb .tl-hd .chip{flex:none;padding:6px 12px;font-size:.78rem;min-height:34px}
body.mb .tl,body.mb .two .tl{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:9px!important;width:100%;max-width:100%}
body.mb .t{min-width:0;max-width:100%;min-height:96px;padding:11px 5px;gap:7px;border-radius:18px}
body.mb .t svg{width:42px;height:42px;padding:9px;border-radius:13px}
body.mb .t span{font-size:.74rem;padding:0 2px}
body.mb .up-card{padding:11px 12px;gap:10px;border-radius:16px;width:100%;max-width:100%;overflow:hidden}
body.mb .up-dt{width:44px;height:44px;border-radius:12px}
body.mb .up-info{min-width:0;flex:1;overflow:hidden}
body.mb .up-info b{font-size:.88rem}
body.mb .up-info small{font-size:.74rem}
body.mb .up-val{flex:none;max-width:96px}
body.mb .up-val b{font-size:.86rem}
body.mb .chips{max-width:100%}
body.mb .chips .chip{font-size:.78rem;padding:7px 12px;min-height:36px}
body.mb .cfg-top{flex-direction:column;align-items:stretch;gap:10px}
body.mb .cfg-top-r{justify-content:space-between;width:100%}
body.mb .cfg-top-r .b{flex:1;min-height:40px;padding:8px 12px;font-size:.84rem}
body.mb .cfg-card{padding:16px;border-radius:22px;gap:12px}
body.mb .cfg-prof-top{flex-direction:column;align-items:center;text-align:center;gap:12px}
body.mb .cfg-prof-top .av-btn{width:86px!important;height:86px!important}
body.mb .cfg-prof-info{width:100%;display:flex;flex-direction:column;align-items:center}
body.mb .cfg-prof-info b{font-size:1.2rem}
body.mb .cfg-prof-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%;margin-top:12px}
body.mb .cfg-prof-acts.cnt-3{grid-template-columns:repeat(3,minmax(0,1fr))}
body.mb .cfg-prof-acts .cfg-pbtn{width:100%;min-height:44px;padding:8px 8px;font-size:.77rem;justify-content:center}
body.mb .clr-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
body.mb .clr-sl{grid-template-columns:66px 1fr 38px;gap:8px}
body.mb .cfg-save-bar{padding:14px;border-radius:18px}
body.mb .mkt-wallet,body.mb .mkt-card{padding:15px;border-radius:20px}
body.mb .mkt-tools{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
body.mb .mkt-tbtn{min-height:68px;padding:8px 4px;font-size:.71rem;border-radius:14px}
body.mb .mkt-flds{grid-template-columns:1fr 78px!important;gap:8px}
body.mb .mkt-flds>div:first-child{grid-column:1 / -1}
body.mb .bio-head{padding:0 14px}
body.mb .bio-txt{margin:4px 14px 12px;padding:11px 12px}
body.mb .bio-wa-wrap{padding:0 14px}
body.mb .bio-acts-row{padding:0 14px;gap:8px}
body.mb .bio-socs-hd{padding:0 14px 8px}
body.mb .bio-socs-grid{padding:0 14px 14px;gap:8px}
body.mb .bio-soc-tile{min-height:84px;padding:10px 6px;border-radius:16px}
body.mb .bio-soc-ico{width:42px;height:42px;border-radius:13px}
body.mb .bio-foot-brand{margin:0 14px}
body.mb .trust-bar{padding:13px 14px;border-radius:16px;flex-direction:column;align-items:flex-start;gap:9px}
body.mb .trust-items{flex-direction:column;align-items:flex-start;gap:6px;width:100%}
body.mb .trust-sep{display:none}
body.mb .trust-dev{width:100%;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--gb) 65%,transparent);flex-wrap:wrap}
.trust-dev .dev-svg-logo{height:21px;max-width:116px;width:auto;display:block;object-fit:contain;flex:none}

/* ===== Configurações Empilhadas Premium ===== */
.cfg-stack{position:relative;display:flex;flex-direction:column;gap:16px;margin:0 auto;padding-bottom:28px;width:100%;max-width:860px}
.cfg-top,.cfg-save-bar{max-width:860px;margin-left:auto;margin-right:auto}
.cfg-stk{position:sticky;top:calc(var(--stt,68px) + var(--pi,0)*14px);min-width:0;max-width:100%}
.cfg-deck-card{
  height:auto;
  border-radius:24px;
  padding:22px;
  border:1px solid color-mix(in srgb,var(--pr) 18%,var(--gb));
  background:linear-gradient(155deg,color-mix(in srgb,var(--cd) 96%,var(--pr) 4%),color-mix(in srgb,var(--cd) 99%,transparent));
  box-shadow:0 -12px 28px rgba(0,0,0,.38),0 16px 34px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.16);
  transform-origin:50% 0;
  will-change:transform,filter;
  transition:border-color .2s;
}
:root[data-theme="light"] .cfg-deck-card{
  background:linear-gradient(155deg,#ffffff 0%,#f5f9f7 100%);
  border-color:color-mix(in srgb,var(--pr) 22%,#d5e2db);
  box-shadow:0 -8px 22px rgba(10,26,32,.08),0 14px 30px rgba(10,26,32,.1),inset 0 1px 0 #ffffff;
}
.cfg-deck-card:hover{border-color:color-mix(in srgb,var(--pr) 40%,var(--gb))}
.cfg-prof-acts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px;width:100%}
.cfg-prof-acts.cnt-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cfg-pbtn{
  all:unset;box-sizing:border-box;
  display:flex;align-items:center;justify-content:center;gap:6px;
  min-height:42px;padding:8px 10px;border-radius:13px;
  border:1px solid var(--gb);
  background:color-mix(in srgb,var(--bg) 52%,var(--cd));
  color:var(--tx);font-size:.8rem;font-weight:700;text-align:center;
  cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:transform .14s,border-color .18s,background .18s,box-shadow .18s;
}
.cfg-pbtn:hover{border-color:color-mix(in srgb,var(--pr) 52%,var(--gb));background:color-mix(in srgb,var(--pr) 10%,var(--cd))}
.cfg-pbtn:active{transform:scale(.97)}
.cfg-pbtn.pri{
  background:var(--adm-bg,var(--pr));
  color:var(--pr-deep,var(--on));
  border-color:color-mix(in srgb,#ffffff 30%,var(--pr));
  font-weight:800;
  box-shadow:0 6px 18px var(--halo);
}
.cfg-pbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cfg-prof-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:.81rem;color:var(--mu)}
body.mb .cfg-prof-meta{justify-content:center}

/* ===== Produtividade Premium ===== */
.prod-shell{display:flex;flex-direction:column;gap:16px;max-width:980px;margin:0 auto;width:100%}
.prod-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prod-hd h1{margin:0;line-height:1.1}
.prod-hd p{margin:4px 0 0;font-size:.86rem;color:var(--mu)}
.prod-ready{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.78rem;font-weight:700;color:var(--mu)}
.prod-ready .ok{color:var(--ok)}
.prod-ready .warn{color:var(--er)}
.prod-ready button{all:unset;cursor:pointer;color:var(--pr);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.prod-hero{
  padding:20px;border-radius:24px;
  border:1px solid color-mix(in srgb,var(--pr) 24%,var(--gb));
  background:linear-gradient(145deg,color-mix(in srgb,var(--pr) 11%,var(--cd)),color-mix(in srgb,var(--cd) 95%,transparent));
  box-shadow:0 14px 34px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.16);
  display:flex;flex-direction:column;gap:14px;
}
:root[data-theme="light"] .prod-hero{
  background:linear-gradient(145deg,color-mix(in srgb,var(--pr) 9%,#ffffff),#ffffff);
  box-shadow:0 12px 28px rgba(10,26,32,.08),inset 0 1px 0 #ffffff;
}
.prod-hero-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prod-hero-hd b{font-size:1rem;letter-spacing:-.01em}
.prod-hero-hd small{font-size:.78rem;color:var(--mu)}
.prod-acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.prod-act-card{
  display:flex;align-items:center;gap:13px;
  padding:15px 16px;border-radius:18px;cursor:pointer;margin:0;
  border:1px solid color-mix(in srgb,var(--pr) 34%,var(--gb));
  background:color-mix(in srgb,var(--bg) 52%,var(--cd));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 20px rgba(0,0,0,.16);
  transition:transform .15s,border-color .2s,box-shadow .2s,background .2s;
  min-width:0;
}
.prod-act-card:hover{transform:translateY(-2px);border-color:var(--pr);box-shadow:0 12px 26px var(--halo)}
.prod-act-card:active{transform:scale(.98)}
.prod-act-card.pri{
  background:var(--adm-bg,var(--pr));
  border-color:color-mix(in srgb,#ffffff 34%,var(--pr));
  box-shadow:0 10px 26px var(--halo),inset 0 1px 0 rgba(255,255,255,.32);
}
.prod-act-ico{
  width:46px;height:46px;border-radius:14px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--pr) 18%,transparent);
  color:var(--pr);
  border:1px solid color-mix(in srgb,var(--pr) 34%,transparent);
}
.prod-act-card.pri .prod-act-ico{
  background:var(--pr-deep,#072a0f);
  color:var(--pr-hi,var(--pr));
  border-color:color-mix(in srgb,var(--pr) 34%,transparent);
}
.prod-act-ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.prod-act-tx{min-width:0;flex:1}
.prod-act-tx b{display:block;font-size:.94rem;font-weight:800;color:var(--tx);line-height:1.2}
.prod-act-tx small{display:block;font-size:.76rem;color:var(--mu);margin-top:3px;line-height:1.3}
.prod-act-card.pri .prod-act-tx b{color:var(--pr-deep,#06270d);font-weight:900}
.prod-act-card.pri .prod-act-tx small{color:color-mix(in srgb,var(--pr-deep,#06270d) 78%,transparent);font-weight:600}
.prod-tip{
  display:flex;align-items:center;gap:9px;
  padding:10px 13px;border-radius:14px;
  border:1px solid var(--gb);
  background:color-mix(in srgb,var(--bg) 44%,transparent);
  font-size:.78rem;color:var(--mu);line-height:1.4;
}
.prod-tip svg{width:16px;height:16px;stroke:var(--pr);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#fw:not(:empty){
  padding:18px;border-radius:22px;
  border:1px solid color-mix(in srgb,var(--pr) 28%,var(--gb));
  background:color-mix(in srgb,var(--cd) 92%,transparent);
  box-shadow:0 14px 34px rgba(0,0,0,.22);
}
.prod-models{
  padding:20px;border-radius:24px;
  border:1px solid var(--gb);
  background:color-mix(in srgb,var(--cd) 90%,transparent);
  box-shadow:0 12px 28px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.12);
  display:flex;flex-direction:column;gap:14px;
}
.prod-models-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.prod-models-hd h2{margin:0;font-size:1.08rem}
.prod-models-hd small{display:block;font-size:.78rem;color:var(--mu);margin-top:2px;font-variant-numeric:tabular-nums}
.prod-models-hd .b{width:auto;min-height:42px;padding:9px 16px;font-size:.86rem}
.prod-list{display:grid;grid-template-columns:1fr;gap:10px}
body.dk .prod-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.prod-item{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 15px;border-radius:18px;cursor:pointer;
  border:1px solid var(--gb);
  background:color-mix(in srgb,var(--bg) 52%,var(--cd));
  transition:transform .15s,border-color .18s,box-shadow .18s;
  min-width:0;
}
.prod-item:hover{border-color:color-mix(in srgb,var(--pr) 46%,var(--gb));transform:translateY(-1px);box-shadow:0 8px 20px rgba(0,0,0,.16)}
.prod-item-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.prod-item-ic{
  width:42px;height:42px;border-radius:13px;flex:none;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--pr) 15%,transparent);color:var(--pr);
  border:1px solid color-mix(in srgb,var(--pr) 28%,transparent);
}
.prod-item-ic svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prod-item-tx{min-width:0;flex:1}
.prod-item-tx b{display:block;font-size:.94rem;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-item-tx small{display:block;font-size:.77rem;color:var(--mu);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod-item-tx a{font-size:.75rem;font-weight:700;color:var(--pr);text-decoration:none}
.prod-item-ac{display:flex;align-items:center;gap:6px;flex:none}
.prod-item-ac button{
  all:unset;box-sizing:border-box;
  min-height:36px;padding:6px 12px;border-radius:11px;
  font-size:.78rem;font-weight:700;cursor:pointer;
  border:1px solid var(--gb);background:var(--cd);color:var(--tx);
  transition:transform .14s,border-color .18s,background .18s;
}
.prod-item-ac button.sign{background:var(--adm-bg,var(--pr));color:var(--pr-deep,var(--on));border-color:transparent;font-weight:800}
.prod-item-ac button.rm:hover{border-color:var(--er);color:var(--er)}
.prod-empty{
  padding:28px 18px;border-radius:18px;text-align:center;
  border:1px dashed color-mix(in srgb,var(--pr) 30%,var(--gb));
  background:color-mix(in srgb,var(--bg) 42%,transparent);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.prod-empty-ic{
  width:52px;height:52px;border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--pr) 15%,transparent);color:var(--pr);

rt=async function(){
  let c=SB();if(!c.tok||!c.auto||ws)return;
  try{await sbq('/auth/v1/user')}catch(e){return}
  c=SB();
  ws=new WebSocket(c.url.replace('https','wss')+'/realtime/v1/websocket?apikey='+c.key+'&vsn=1.0.0');
  ws.onopen=()=>{
    ws.send(JSON.stringify({topic:'realtime:enfapp',event:'phx_join',payload:{config:{postgres_changes:[
      {event:'*',schema:'public',table:'app_data'},
      {event:'*',schema:'public',table:'user_notifications'},
      {event:'UPDATE',schema:'public',table:'profiles'}
    ]},access_token:c.tok},ref:'1'}));
    hb=setInterval(()=>ws&&ws.readyState==1&&ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:'2'})),25000);
  };
  ws.onmessage=async m=>{
    try{
      const d=JSON.parse(m.data);if(d.event!='postgres_changes')return;
      const tbl=d.payload&&d.payload.data&&d.payload.data.table,x=d.payload&&d.payload.data&&d.payload.data.record;
      if(tbl=='app_data'&&x&&x.key&&!SKP.includes(x.key)){
        const n=JSON.stringify(x.value);if(localStorage.getItem(x.key)!=n){_si.call(localStorage,x.key,n);if(ld())render()}
      }else if(tbl=='user_notifications'){
        await loadNotifs(true);if(ld())render();
      }else if(tbl=='profiles'&&x&&x.id==SB().uid){
        await lp();if(ld())render();snack('Sua conta ou plano foi atualizado');
      }
    }catch(e){}
  };
  ws.onclose=()=>{clearInterval(hb);ws=null;if(SB().auto&&SB().tok)setTimeout(rt,6000)};
};

create or replace function public.admin_manage_user(p_id uuid,p_plan text,p_status text,p_expires date default null,p_whatsapp text default null,p_notes text default null,p_notif_title text default null,p_notif_body text default null,p_notif_kind text default 'plano',p_amount numeric default null) returns void language plpgsql security definer set search_path=public as $$
declare u_email text;
begin
  if not public.is_master() then raise exception 'sem permissao'; end if;
  update public.profiles set plan=p_plan,status=p_status,plan_expires_at=p_expires,whatsapp=coalesce(p_whatsapp,whatsapp),admin_notes=p_notes,updated_at=now() where id=p_id and role<>'master' returning email into u_email;
  if p_notif_title is not null and p_notif_body is not null then
    insert into public.user_notifications (user_id,user_email,kind,title,body,amount,due_date,created_by) values (p_id,u_email,coalesce(p_notif_kind,'plano'),p_notif_title,p_notif_body,p_amount,p_expires,auth.uid());
  end if;
end $$;
grant execute on function public.admin_manage_user(uuid,text,text,date,text,text,text,text,text,numeric) to authenticated;
create or replace function public.user_change_plan(p_plan text,p_cycle text default 'mensal',p_trial boolean default false) returns void language plpgsql security definer set search_path=public as $$
declare st text; days int; exp date; pl_name text;
begin
  select status into st from public.profiles where id=auth.uid();
  if st='bloqueado' then raise exception 'conta bloqueada'; end if;
  if p_trial then select coalesce(trial_days,7) into days from public.plan_limits where plan=p_plan; exp:=current_date+days;
  else exp:=case when p_cycle='anual' then current_date+365 else current_date+30 end; end if;
  update public.profiles set plan=p_plan,status=case when p_trial then 'teste' else 'ativo' end,plan_expires_at=exp,updated_at=now() where id=auth.uid() and role<>'master';
  pl_name:=case p_plan when 'basico' then 'Básico' when 'profissional' then 'Profissional' else 'Premium' end;
  insert into public.user_notifications (user_id,kind,title,body,due_date,created_by) values (auth.uid(),'plano',case when p_trial then 'Período de teste ativado' else 'Plano atualizado com sucesso' end,'Seu plano agora é '||pl_name||' com validade até '||to_char(exp,'DD/MM/YYYY')||'.',exp,auth.uid());
end $$;
grant execute on function public.user_change_plan(text,text,boolean) to authenticated;`;

async function admLoadUsers(){
  const c=SB(),meta=L('enf_adm_meta',{}),localExtras=L('enf_adm_users',[]);
  let remote=[];
  if(c.tok){
    try{
      let q=await sbq('/rest/v1/profiles?select=id,nome,email,whatsapp,plan,role,status,plan_expires_at,admin_notes,created_at&order=created_at.desc');
      if(!q.ok){window._sqlWarn=1;q=await sbq('/rest/v1/profiles?select=id,nome,email,plan,role,created_at&order=created_at.desc')}
      if(q.ok)remote=await q.json();
    }catch(e){}
  }
  const byId={};
  remote.forEach(u=>{const ov=meta[u.id]||{};byId[u.id]={...u,...ov,status:u.status||ov.status||'ativo',whatsapp:u.whatsapp||ov.whatsapp||'',plan_expires_at:u.plan_expires_at||ov.plan_expires_at||'',admin_notes:u.admin_notes||ov.admin_notes||''}});
  localExtras.forEach(u=>{if(!byId[u.id])byId[u.id]={...u,...(meta[u.id]||{})}});
  window._admUsers=Object.values(byId);
  return window._admUsers;
}

async function saveAdmUser(id){
  const u=(window._admUsers||[]).find(x=>String(x.id)==String(id));if(!u)return;
  const cfg=getPCfg(),plan=$('#au_pl').value,status=$('#au_st').value,exp=$('#au_exp').value||null,wa=($('#au_wa').value||'').trim(),notes=($('#au_nt').value||'').trim(),sendN=$('#au_nf').checked;
  const pl=cfg.plans[plan],plName=pl.n;
  let nTitle='Atualização da sua conta ENFapp',nKind='plano',nBody='';
  if(status=='bloqueado'){
    nTitle='Acesso ao ENFapp suspenso';nKind='bloqueio';
    nBody=`Olá ${u.nome||''}, seu acesso ao ENFapp foi temporariamente bloqueado.${notes?' Motivo: '+notes+'.':''} Fale com o administrador para regularizar.`;
  }else if(status=='teste'){
    nTitle='Período de teste liberado!';nKind='sucesso';
    nBody=`Olá ${u.nome||''}, liberamos o plano ${plName} em modo de teste para você${exp?' até '+D(exp):''}. Aproveite todos os recursos!`;
  }else if(status=='vencido'){
    nTitle='Fatura / Plano pendente de renovação';nKind='fatura';
    nBody=`Olá ${u.nome||''}, seu plano ${plName} (${R(pl.price)}/mês) está aguardando pagamento${exp?' (vencimento '+D(exp)+')':''}.${cfg.billing.pix?' Chave Pix: '+cfg.billing.pix:''}`;
  }else{
    nTitle='Plano '+plName+' liberado!';nKind='sucesso';
    nBody=`Olá ${u.nome||''}, seu plano no ENFapp foi atualizado para ${plName}${exp?' com validade até '+D(exp):''}. Bom trabalho!`;
  }

  // Persist local override immediately

async function admSendNotif(channel){
  const to=$('#an_to')?.value||'all',kind=$('#an_k')?.value||'info',title=($('#an_t')?.value||'').trim(),body=($('#an_b')?.value||'').trim();
  const amount=$('#an_v')?.value?parseFloat($('#an_v').value):null,due=$('#an_d')?.value||null;
  if(!title||!body)return snack('Preencha o título e a mensagem do aviso.');
  const all=(window._admUsers||[]).filter(u=>u.role!='master');
  let targets=[];
  if(to=='all')targets=all;
  else if(to=='f_teste')targets=all.filter(u=>userSt(u)=='teste');
  else if(to=='f_venc')targets=all.filter(u=>['vencido','bloqueado'].includes(userSt(u)));
  else{const one=all.find(u=>String(u.id)==String(to));if(one)targets=[one]}

  if(channel=='wa'){
    const u=targets[0],msg=`*${title}*\n\n${body}`;
    openExt(waLink(u?u.whatsapp:'',msg));
    return snack(u&&u.whatsapp?'Abrindo WhatsApp de '+(u.nome||u.email):'Abrindo WhatsApp com a mensagem pronta');
  }
  if(channel=='em'){
    const emails=targets.map(u=>u.email).filter(Boolean).join(',');
    openExt(mailLink(emails,title+' - ENFapp',body));
    return snack('Abrindo e-mail com a mensagem pronta');
  }

  // Send in-app notification
  const c=SB(),now=new Date().toISOString(),sent=L('enf_adm_sent',[]);
  if(targets.length){
    for(const u of targets){
      const rec={id:'adm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),user_id:String(u.id).includes('-')?u.id:null,user_email:u.email,user_name:u.nome,user_wa:u.whatsapp||'',kind,title,body,amount,due_date:due,read_at:null,created_at:now};
      sent.unshift(rec);
      if(c.tok&&String(u.id).includes('-')){
        try{
          const r=await sbq('/rest/v1/user_notifications',{method:'POST',h:{Prefer:'return=minimal'},body:JSON.stringify({user_id:u.id,user_email:u.email,kind,title,body,amount,due_date:due})});
          if(!r.ok)window._sqlWarn=1;
        }catch(e){}
      }
      if(String(u.email||'').toLowerCase()==String(prof().email||'').toLowerCase())pushLocalNotif(rec);
    }
  }else{
    const rec={id:'adm_'+Date.now(),user_id:'all',user_email:'',kind,title,body,amount,due_date:due,read_at:null,created_at:now};
    sent.unshift(rec);pushLocalNotif(rec);
  }
  S('enf_adm_sent',sent.slice(0,80));
  if($('#an_t'))$('#an_t').value='';if($('#an_b'))$('#an_b').value='';
  snack(`Notificação enviada no app para ${targets.length||1} usuário(s)!`);
  renderAdmAvisos($('#adm_body'));
}

}

(function initTlLongPress(){
  let tm=null,sx=0,sy=0;
  const clear=()=>{if(tm){clearTimeout(tm);tm=null}};
  const isInteractive=el=>!!(el&&el.closest&&el.closest('button,a,input,select,textarea,label,.c,.m,header,.bar,nav,.pill,.nbanner,.tl-bar,.k'));
  document.addEventListener('pointerdown',e=>{
    clear();

    if(e.button&&e.button!==0)return;
    if(isInteractive(e.target))return;
    sx=e.clientX;sy=e.clientY;
    tm=setTimeout(()=>{
      tm=null;
      navigator.vibrate&&navigator.vibrate(35);
      tlEditToggle(!window._tlEdit);
      snack(window._tlEdit?'Modo organizar ativado: arraste os botões':'Organização salva!');
    },460);
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(tm&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)clear();
  },{passive:true});
